           it names a tab that is not active yet, and a name asserting otherwise
           is how the next reader reintroduces the read. Every call that is not
           the transition omits the argument and behaves exactly as before.

           `animateCards` is false only for a tab arriving on a slide. The
           entrance fade exists to soften a grid appearing in place; a tab that
           is travelling across the viewport as one object is already a soft
           arrival, and staggering its cards underneath the slide is both
           redundant and the most expensive thing on that frame. */
        /* Everything that decides what a tab's grid shows, as one string.

           MAKE THIS TOTAL, NOT CLEVER. It exists so a render can be skipped, and
           the two ways it can be wrong do not cost the same. Reporting a current
           tab as stale costs a render nobody needed — 143ms, and nothing else.
           Reporting a stale tab as current shows the viewer a grid that does not
           match their search, sort or genre, and this application's oldest
           failure is a wrong library that looks like a working one. Anything
           that can change what the window shows belongs here; if you are not
           sure whether it does, it belongs here.

           `data.length` stands in for the snapshot's identity. The library is
           loaded once at boot and never mutated in place, so a change to it is a
           reload — but a server switch swaps the arrays, and the length is what
           notices.

           `JSON.stringify` rather than joining on a delimiter, because two of
           these fields are free text. The search term and the genre both admit
           spaces, so a space-joined signature cannot tell searching "a b" in
           genre "c" from searching "a" in genre "b c" — they produce the same
           string. That is a collision in the one direction this must never be
           wrong in: two different selections reported as the same, which shows
           the viewer the other one's grid. Any single delimiter has some such
           pair; quoting removes the question rather than moving it. */
        function renderSignature(type, searchTerm, data) {
            return JSON.stringify([type, searchTerm, currentGenre, currentSortMethod, data.length]);
        }

        /* Keep the tab the viewer is NOT looking at current, at idle.

           `requestIdleCallback` is not in Safari before 16.4, and iOS is the
           platform this whole gesture exists for, so the fallback is not
           defensive tidiness — without it the warm never runs on a large share
           of the devices that need it, the drag silently pays the full render
           every time, and it presents as the gesture being slow on iPhones
           only. The timeout option bounds the wait where rIC does exist: a
           browser that never goes idle must still warm the tab eventually. */
        let pendingWarm = null;

        /* A pending warm is stored as the closure that cancels it, not as a
           handle plus a canceller to pair with it.

           `requestIdleCallback` and `setTimeout` both return a number, from
           unrelated id spaces. Holding just the number and calling both
           cancellers means `clearTimeout` is handed an idle handle — which is a
           valid timeout id belonging to something else, cancelled silently.

           Pairing them in an object fixes that and introduces a worse one:
           `pendingWarm.cancel(...)` invokes a native function as a method, so
           `this` is the object rather than `window`, and both of these throw
           `TypeError: Illegal invocation` when called that way. A closure has
           neither problem — the handle is captured, and the call keeps its
           original receiver. */
        function cancelWarm() {
            if (pendingWarm === null) return;
            pendingWarm();
            pendingWarm = null;
        }

        function warmInactiveTab(justRendered) {
            const other = justRendered === 'movies' ? 'tvshows' : 'movies';
            cancelWarm();

            const run = () => {
                pendingWarm = null;
                /* Re-checked at run time, not at schedule time. Idle is later,
                   and a drag may have started in between — warming then would
                   rebuild a grid that is on screen and mid-gesture. */
                if (tabGestureActive()) return;
                const term = document.querySelector('.search-input').value.toLowerCase();
                filterAndSortMedia(term, other, false);
            };

            if (typeof requestIdleCallback === 'function') {
                const handle = requestIdleCallback(run, { timeout: 2000 });
                pendingWarm = () => cancelIdleCallback(handle);
            } else {
                const handle = setTimeout(run, 200);
                pendingWarm = () => clearTimeout(handle);
            }
        }

        function filterAndSortMedia(searchTerm, type, animateCards = true) {
            const target = type || document.querySelector('.tab.active').dataset.content;
            const data = target === 'movies' ? moviesData : tvShowsData;

            /* Already showing exactly this. Rebuilding it would produce the same
               nodes for 143ms at library scale, and the drag moves that cost
               from the dead air after a finger lifts onto the first frame of a
               gesture the viewer is driving.

               Both conditions are required. The signature says the SELECTION is
               unchanged; `rendered` says the grid actually holds the result of
               it. A view whose signature matches but which was emptied — by a
               server switch, or by a render that threw — must rebuild.

               An entrance animation is a reason to render anyway: the caller is
               asking for the cards to arrive, not merely to be present.

               THE WINDOW POSITION IS PART OF WHAT IS RENDERED, and leaving it
               out of this shipped a blank grid. The signature answers "is the
               selection unchanged" and says nothing about WHERE the rendered
               window sits. Scrolling a tab moves that window — at 6,000px the
               grid was rendering from item 24, standing on a ~4,000px spacer —
               and the tab is then shown again at its TOP, where the spacer is.
               Every caller that skips is about to show the tab from its first
               item, so the window has to be there. Measured before this branch
               existed: 0 of 120 rendered cards on screen, and the viewer had to
               scroll down four thousand pixels to find their own library.

               Re-windowing is not re-rendering: ~45ms to rebuild the window
               against data already filtered and sorted, against ~175ms to do
               the whole thing again. The skip keeps its value. */
            const signature = renderSignature(target, searchTerm, data);
            const view = gridView(target);
            if (!animateCards && view.signature === signature && view.rendered > 0) {
                if (view.first !== 0) renderWindow(view, 0, false);
                return;
            }

            // First filter by search term
            let filtered = data.filter(item =>
                item.title.toLowerCase().includes(searchTerm)
            );

            // Then filter by genre if necessary
            if (currentGenre !== 'all') {
                filtered = filtered.filter(item =>
                    item.genres && item.genres.includes(currentGenre)
                );
            }

            // Sort the filtered data using the current sort method
            const sortedData = sortMedia(filtered, currentSortMethod);

            // Display the sorted data
            displayMedia(sortedData, target, animateCards);

            /* Recorded only after the render has actually happened, so a throw
               above leaves the view marked stale rather than marked as holding
               something it does not. */
            view.signature = signature;

            /* Bring the OTHER tab up to date while nothing is waiting on it.

               This is what makes the skip above hit rather than merely exist. A
               drag has to have the incoming tab rendered before it can move it,
               and the thumb is already on the glass by then; doing it here moves
               that work to a moment with no gesture in it.

               Reached only when a render actually happened — the early return
               above skips this too. That is what terminates the recursion:
               rendering movies warms tvshows, which finds movies already current
               and returns before scheduling anything. */
            warmInactiveTab(target);
        }

        /* ------------------------------------------------------------------
           The windowed grid

           The grid renders a slice near the viewport, not the whole library.
           A library is data; a grid is a rendering of part of it. Rendering
           every item tied the browser's per-frame style, layout and paint cost
           to how much media the user owns, so the app got slower for exactly
           the people who use it most.

           Measured at 7,000 movies, 390x844, before this existed:

             | cards | DOM nodes | idle   | scroll-lock relayout |
             | 7000  | 63,248    | 3.0fps | 666ms                |
             | 2000  | 18,248    | 10.9   | 178ms                |
             |  800  |  7,448    | 29.9   |  71ms                |
             |  300  |  2,948    | 59.9   |  28ms                |
             |    0  |    236    | 59.9   |   0.7ms              |

           Six cards are on screen at 390px and ten at 1280px, in a document
           1,227,442px tall. The overlay trays were reported as "choppy"
           because of this and there is nothing wrong with the trays: at 3fps a
           280ms tray animation gets one frame, so it jumps.

           Re-measure with `tools/grid_metrics.py`, and only ever against a
           library seeded to thousands — a few-hundred-item fixture cannot fail
           these numbers, which is how this survived a browser check once
           already.
           ------------------------------------------------------------------ */

        /* Items rendered at once. An order of magnitude below the measured
           ceiling (60fps still held at 300) and well above what any viewport
           shows, with room for a wide desktop grid's five columns. */
        const GRID_WINDOW_ITEMS = 120;

        /* Rows rendered beyond the viewport, so a fast flick does not outrun
           the render and show blank rows. */
        const GRID_OVERSCAN_ROWS = 4;

        /* Entrance stagger, by ROW rather than by item, and capped.

           This was `index * 0.03s` computed from the item's position in the
           WHOLE library, which is a delay multiplied by a number the app does
           not control: the 7,000th card waited 209.97 seconds. Measured, 6,611
           of 7,000 cards were still `opacity: 0` twenty-five seconds after
           load — the grid was not slow to animate, most of it was invisible,
           and scrolling into it showed empty space where cards were.

           An entrance animation softens an arrival the viewer is watching. A
           delay longer than their attention is not a softer arrival, it is a
           missing item. */
        const GRID_STAGGER_PER_ROW = 0.04;
        const GRID_STAGGER_CAP = 0.3;

        // One view per tab. The inactive tab keeps whatever it last rendered,
        // which is bounded now rather than a second full library.
        const gridViews = new Map();

        function gridView(type) {
            if (gridViews.has(type)) return gridViews.get(type);

            const grid = document.querySelector(`#${type}-content .media-grid`);
            const view = {
                type,
                grid,
                data: [],
                first: 0,
                rendered: 0,
                perRow: 1,
                rowPitch: 1,
                rowGap: 0,
                /* Whether `perRow` and `rowPitch` above were ever read from a
                   grid that had been laid out.

                   This is a SEPARATE flag rather than a sentinel pitch, because
                   a pitch of zero already means something: it is what a hidden
                   grid reports, and it reads as a successfully measured grid
                   whose rows have no height. Every consequence then follows
                   silently — the window arithmetic divides by it, the spacers
                   compute to negative lengths the browser discards as invalid,
                   and the tab ends after one window with the rest of the library
                   beyond any scroll. Measured before this flag existed: a phone
                   swiping to a 400-show tab reached item 120 of 400, on a
                   document 21,649px tall against the 71,926px it should be.

                   "Never measured" and "needs no window" have to be
                   distinguishable, or a grid that was never measurable presents
                   as a healthy one. */
                measured: false,
                topSpacer: makeSpacer(),
                bottomSpacer: makeSpacer(),
                /* What this view last rendered, as a signature — see
                   `renderSignature()`. Null means "nothing", which is not the
                   same as "something that happens not to match": a tab that has
                   never rendered must always render. */
                signature: null,
            };

            /* One delegated listener for the whole grid, not one per card.
               There were 7,000 closures here; more to the point, a recycled
               card must not be able to carry a stale handler for the item that
               used to occupy it. */
            grid.addEventListener('click', event => {
                const card = event.target.closest('.media-item');
                if (!card || !grid.contains(card)) return;
                const item = view.data[Number(card.dataset.index)];
                if (item) openModal(item, view.type);
            });

            gridViews.set(type, view);
            return view;
        }

        /* A spacer stands in for the rows that are not rendered, so the
           document keeps the height the full selection would occupy and the
           viewer's scroll position means the same thing before and after the
           window moves.

           `grid-column: 1 / -1` is load-bearing. Without it `auto-fill` places
           the spacer as an ordinary cell: it consumes a grid position, every
           following card shifts one column left, and the row arithmetic goes
           wrong in a way that reads as an off-by-one in the window rather than
           as a layout bug. */
        function makeSpacer() {
            const spacer = document.createElement('div');
            spacer.className = 'grid-spacer';
            spacer.setAttribute('aria-hidden', 'true');
            spacer.style.gridColumn = '1 / -1';
            return spacer;
        }

        /* Geometry read from the rendered grid, never assumed.

           `auto-fill` decides the column count from the available width, so a
           column count derived from a breakpoint is wrong at every width the
           breakpoint did not anticipate — the same class of mistake as the
           hardcoded 280px backdrop height this project already paid for. */
        function measureGrid(view) {
            /* THE CARD IS READ FIRST, AND NOTHING IS WRITTEN UNTIL IT ANSWERS.

               A grid with no layout does not report an error — it reports
               zeros. An element inside a `display: none` ancestor has no boxes,
               so its card measures 0 tall, and `getComputedStyle` hands back
               the COMPUTED track list rather than the used one: on a desktop
               `repeat(auto-fill, minmax(200px, 1fr))` splits into three
               fragments and yields a column count of 3 that no width ever
               produced. Both numbers look like measurements.

               So a failed read leaves the view's geometry untouched and says
               so. It is decided from the measurement itself and NOT from
               whether the tab is displayed: a second condition describing the
               same fact has to be kept in step with every path that renders a
               hidden grid — `beginTabTransition()`, `warmInactiveTab()`, and
               whatever is added next — and this repo has already shipped a pair
               of conditions that were meant to be one and drifted. A
               measurement that can tell it failed cannot drift from itself.
               Same reasoning as the overlay system keying on the DOM rather
               than on a registry.

               A missing card and a card with no height take the same branch on
               purpose. `displayMedia()` calls this before its first render,
               when there is nothing to measure yet; that is the same "not
               measurable" answer, and it needs no second condition either. */
            const card = view.grid.querySelector('.media-item');
            const cardHeight = card ? card.getBoundingClientRect().height : 0;
            if (cardHeight <= 0) {
                view.measured = false;
                return false;
            }

            const styles = getComputedStyle(view.grid);
            const columns = styles.gridTemplateColumns.split(' ').filter(Boolean);
            view.perRow = Math.max(1, columns.length);
            view.rowGap = parseFloat(styles.rowGap) || 0;
            /* The grid is padded, so its border box starts 20px above its first
               row. Measuring rows from the border box puts every row boundary a
               fifth of a row out — not enough to look broken, enough to pick
               the wrong row near the threshold. */
            view.padTop = parseFloat(styles.paddingTop) || 0;
            view.rowPitch = cardHeight + view.rowGap;
            view.measured = true;
            return true;
        }

        // Whole rows only: a partial row would leave a ragged edge mid-grid.
        function windowRows(view) {
            return Math.max(1, Math.ceil(GRID_WINDOW_ITEMS / view.perRow));
        }

        /* Which row the viewer is looking at. The grid's own offset is stable
           regardless of the spacers, because what sits above the grid does not
           change when the window moves. */
        function firstVisibleRow(view) {
            if (view.rowPitch <= 0) return 0;
            const contentTop =
                view.grid.getBoundingClientRect().top + window.scrollY + view.padTop;
            return Math.floor((window.scrollY - contentTop) / view.rowPitch);
        }

        // How many rows the viewport can show at once, rounded up.
        function viewportRows(view) {
            if (view.rowPitch <= 0) return 1;
            return Math.max(1, Math.ceil(window.innerHeight / view.rowPitch));
        }

        function totalRows(view) {
            return Math.ceil(view.data.length / view.perRow);
        }

        /* Where the window sits: CENTRED on the viewer, not hung below them.

           It used to start `GRID_OVERSCAN_ROWS` above the viewer and run the
           window's full depth downward — four rows above against fifty-six
           below at two columns. Scrolling DOWN then had most of a window in
           hand while scrolling UP had four rows, so the direction with almost
           no runway was also the one most likely to be travelling back over
           artwork the viewer had already loaded. That is the case they
           reported.

           Centring is also what makes the edge trigger below worth having: from
           the middle, the viewer can travel about half a window in EITHER
           direction before anything has to be rebuilt.

           The clamp is against the last full window rather than against the
           last item. `Math.min(start, data.length - 1)` allowed a first index
           of `length - 1`, which renders exactly one card at the foot of a
           large library — the count is `total - first`. Clamping to
           `totalRows - windowRows` keeps a full window against the end. */
        function desiredFirstIndex(view) {
            const rows = windowRows(view);
            const lead = Math.max(0, Math.floor((rows - viewportRows(view)) / 2));
            const lastStart = Math.max(0, totalRows(view) - rows);
            const startRow = Math.min(Math.max(0, firstVisibleRow(view) - lead), lastStart);
            return startRow * view.perRow;
        }

        /* Whether the viewer has come close enough to an edge of what is
           rendered that the window has to move.

           THE TRIGGER IS THE EDGE, NOT THE ROW. `desiredFirstIndex()` changes
           every time the viewer crosses a single row, and re-rendering on that
           rebuilt the entire window — sixty rows at two columns — to change
           under two percent of what it held. Every card the viewer was looking
           at was destroyed and rebuilt in the process, which is what the
           flicker was: a rebuilt card starts with no `src`, so its poster
           returns to a placeholder and fades in again. Measured at 2,000
           movies on a 390px viewport: 55 rebuilds per window traversal, in each
           direction.

           Proximity to an end of the LIBRARY is not a reason to move — there is
           nothing further to render that way, and treating it as one would
           re-render on every row at the top and bottom of the grid, which is
           exactly the defect this replaces. */
        function windowNeedsMove(view) {
            const perRow = view.perRow;
            const firstRow = Math.floor(view.first / perRow);
            const lastRow = firstRow + Math.ceil(view.rendered / perRow) - 1;
            const viewerTop = firstVisibleRow(view);
            const viewerBottom = viewerTop + viewportRows(view);

            if (firstRow > 0 && viewerTop - firstRow < GRID_OVERSCAN_ROWS) return true;
            if (lastRow < totalRows(view) - 1 && lastRow - viewerBottom < GRID_OVERSCAN_ROWS) {
                return true;
            }
            return false;
        }

        function renderWindow(view, first, animate) {
            const total = view.data.length;
            const perRow = view.perRow;
            const rows = windowRows(view);
            const count = Math.min(rows * perRow, total - first);

            // Unobserve what is leaving. The observer would otherwise
            // accumulate targets that are no longer in the document — the leak
            // windowing exists to prevent, reintroduced through the back door.
            view.grid.querySelectorAll('.poster').forEach(img => imageObserver.unobserve(img));

            const fragment = document.createDocumentFragment();
            for (let i = first; i < first + count; i++) {
                fragment.appendChild(buildCard(view, i, animate ? i - first : -1));
            }

            const totalRows = Math.ceil(total / perRow);
            const rowsBefore = Math.floor(first / perRow);
            const rowsAfter = Math.max(0, totalRows - rowsBefore - Math.ceil(count / perRow));

            /* A spacer standing in for zero rows is not zero-height — it is
               still a grid item, so it still opens a row and still adds a gap.
               It has to leave the layout entirely. */
            sizeSpacer(view.topSpacer, rowsBefore, view);
            sizeSpacer(view.bottomSpacer, rowsAfter, view);

            view.grid.replaceChildren(view.topSpacer, fragment, view.bottomSpacer);

            view.first = first;
            view.rendered = count;

            /* Only the posters that still need loading. One built with its
               `src` already set has nothing for the observer to do, and
               observing it would put it back on the lazy path it was built to
               skip. The unobserve above stays broad — it is a no-op for an
               element that was never observed, and a narrow one would have to
               be kept in step with this selector to avoid leaking the targets
               windowing exists to bound. */
            view.grid.querySelectorAll('.poster[data-src]')
                .forEach(img => imageObserver.observe(img));
        }

        function sizeSpacer(spacer, rows, view) {
            if (rows <= 0) {
                spacer.style.display = 'none';
                spacer.style.height = '0px';
                return;
            }
            spacer.style.display = '';
            /* The spacer's own trailing gap is part of the rows it replaces.

               Clamped at zero because a negative length is INVALID CSS and the
               CSSOM discards it silently: the assignment is rejected, the
               property keeps whatever it had, and the document is quietly short
               by every row the spacer was standing in for. That is how an
               unmeasured grid used to end after its first window — `rows * 0 -
               15` is `-15px`, dropped without a word. An unmeasured view no
               longer reaches this, but the clamp stays: it is the difference
               between a wrong height and no height at all. */
            spacer.style.height = `${Math.max(0, rows * view.rowPitch - view.rowGap)}px`;
        }

        function buildCard(view, index, animationOrder) {
            const item = view.data[index];
            const type = view.type;

            const mediaItem = document.createElement('div');
            mediaItem.className = 'media-item';
            mediaItem.dataset.id = item.id;
            mediaItem.dataset.type = type;
            // The delegated listener resolves the item through this, so a
            // recycled element cannot open the item it used to hold.
            mediaItem.dataset.index = String(index);

            if (animationOrder >= 0) {
                const row = Math.floor(animationOrder / view.perRow);
                const delay = Math.min(row * GRID_STAGGER_PER_ROW, GRID_STAGGER_CAP);
                mediaItem.style.opacity = '0';
                mediaItem.style.transition = `opacity 0.3s ease ${delay}s, transform 0.3s ease ${delay}s`;
                /* Flipped on the next frame rather than by a timer per card.
                   There were 7,000 of those. One frame is all the browser needs
                   to have taken the starting value. */
                requestAnimationFrame(() => {
                    mediaItem.style.opacity = '1';
                });
            }

            const posterPath = type === 'movies' ?
                dataUrl('posters', 'movies', `${item.id}.jpg`) :
                dataUrl('posters', 'tvshows', `${item.id}.jpg`);

            const addedDate = formatDate(item.addedAt);

            /* A poster that has already loaded is built AS loaded: `src` set,
               no placeholder, no entrance fade. The browser paints it from
               cache on this frame, so moving the window over artwork the viewer
               is looking at is invisible rather than a blink.

               The lazy path is unchanged for a poster that has never loaded —
               it keeps `data-src`, its placeholder and its error handling, and
               it is the only path `imageObserver` is given. A poster that
               failed is never recorded, so it cannot reach this branch and skip
               the text placeholder it needs.

               The trade is that a known-loaded poster carries no `onerror`. For
               it to fail now, its image would have to be evicted from the HTTP
               cache and the network be gone — at which point the alt text
               stands in, and the cost of the alternative is a listener on every
               card, which is the thing this grid may not do. */
            const posterMarkup = loadedPosters.has(posterPath)
                ? `<img src="${posterPath}" alt="${item.title}" class="poster loaded">`
                : `<div class="poster-placeholder">
                        <div class="loading-spinner"></div>
                    </div>
                    <img data-src="${posterPath}"
                         alt="${item.title}"
                         class="poster">`;

            mediaItem.innerHTML = `
                <div class="poster-container">
                    ${posterMarkup}
                </div>
                <div class="media-info">
                    <div class="media-title">${item.title}</div>
                    <div class="media-year">${item.year}</div>
                    <div class="media-added">Added: ${addedDate}</div>
                </div>
            `;

            return mediaItem;
        }

        /* Re-render only when the window has actually moved. Scrolling inside
           the current window must cost nothing, or the fix reintroduces
           per-frame work by another route. */
        function updateGridWindow(view) {
            /* Not while the tabs are mid-gesture.

               The window is derived from `getBoundingClientRect().top`, and a
               tab in a gesture is pinned out of the scroller at a CAPTURED
               offset — where the viewer was when the gesture began, or, for the
               incoming tab, its own top. Neither is the page's scroll position.
               A window computed now would be computed against a position the
               viewer never occupied, and it would present as an off-by-one in
               the grid rather than as anything to do with the transition.

               THIS REFUSAL PREDATES THE THING IT WAS WRITTEN FOR AND OUTLIVES
               IT. It went in when the drag also scaled the tabs, which moved
               that same measured top; the scale is gone and this is not. It
               stands on the freeze, which is not going anywhere: the freeze is
               what makes the gesture possible at all.

               It is also NOT the fact that a tab pinned with `position: fixed`
               receives no scroll events. That is true today, it is a
               consequence of the freeze rather than a rule anyone stated, and a
               safety implied by a mechanism disappears the moment the mechanism
               changes. This project has already shipped a pair of conditions
               that were meant to be one and drifted; an explicit refusal cannot
               drift from itself. */
            if (tabGestureActive()) return;

            if (!view || view.data.length === 0) return;

            /* A view that has never been measurable is repaired here rather
               than left refusing forever.

               `endTabTransition()` measures a tab as it lands, which is the
               deterministic path. This is the safety net for any other route
               that renders a grid before it is displayed: the measurement is
               attempted once the grid is on screen, and until one succeeds the
               window is not moved. Rendering from placeholder geometry is what
               produced a tab that scrolled, looked correct, and quietly held a
               third of its library. */
            if (!view.measured && !measureGrid(view)) return;

            /* Only when the viewer has reached an edge — see
               `windowNeedsMove()`. This used to compare the desired anchor
               against the current one, which moves every row. */
            if (!windowNeedsMove(view)) return;
            renderWindow(view, desiredFirstIndex(view), false);
        }

        function activeGridView() {
            const activeTab = document.querySelector('.tab.active');
            return activeTab ? gridViews.get(activeTab.dataset.content) : null;
        }

        (function watchScrollForWindow() {
            let queued = false;
            function schedule() {
                if (queued) return;
                queued = true;
                requestAnimationFrame(() => {
                    queued = false;
                    updateGridWindow(activeGridView());
                });
            }
            window.addEventListener('scroll', schedule, { passive: true });
            window.addEventListener('resize', () => {
                /* Resolve a live gesture BEFORE re-measuring, not after.
                   Everything below reads geometry, and a drag has both tabs
                   pinned, scaled and translated — measuring through that reads
                   a layout that does not exist at any width. Ending the gesture
                   first also means a rotation mid-drag leaves nothing pinned. */
                endTabTransition();

                const view = activeGridView();
                if (!view || view.data.length === 0) return;
                // `perRow` changes with width, so every row index computed for
                // the old column count is wrong. Re-measure, then re-render
                // from where the viewer is rather than from the top.
                /* A resize that cannot measure changes nothing. It is
                   reachable: the viewport can change while this tab is hidden.
                   Re-rendering from the old column count would be worse than
                   waiting for the tab to land and be measured there. */
                if (!measureGrid(view)) return;
                renderWindow(view, desiredFirstIndex(view), false);
            });
        })();

        // Display media items with enhanced animations
        function displayMedia(data, type, animateCards = true) {
            const contentDiv = document.querySelector(`#${type}-content`);
            const loadingDiv = contentDiv.querySelector('.loading');
            const grid = contentDiv.querySelector('.media-grid');
            const noResultsDiv = contentDiv.querySelector('.no-results');

            // Hide loading spinner
            loadingDiv.style.display = 'none';

            // Always start with an empty grid
            grid.innerHTML = '';

            // Check if there are no results to display
            if (data.length === 0) {
                // Get the current search term
                const searchTerm = document.querySelector('.search-input').value.trim();
                const messageElem = contentDiv.querySelector('.no-results-message');
                const helpElem = contentDiv.querySelector('.no-results-help');

                // Build the appropriate message based on whether there's a search term and/or genre filter
                if (currentGenre !== 'all') {
                    if (searchTerm) {
                        messageElem.innerHTML =
                            `We couldn't find any ${type === 'movies' ? 'Movies' : 'TV Shows'} 
                             in the "${currentGenre}" genre matching "<span class="search-term">${searchTerm}</span>"`;
                        helpElem.textContent = 'Try searching for something else or clearing your search';
                    } else {
                        messageElem.innerHTML =
                            `No ${type === 'movies' ? 'Movies' : 'TV Shows'} found in the "${currentGenre}" genre`;
                        helpElem.textContent = 'Try selecting a different genre';
                    }
                } else {
                    if (searchTerm) {
                        messageElem.innerHTML =
                            `We couldn't find any ${type === 'movies' ? 'Movies' : 'TV Shows'} 
                             matching "<span class="search-term">${searchTerm}</span>"`;
                        helpElem.textContent = 'Try searching for something else or clearing your search';
                    } else {
                        messageElem.innerHTML =
                            `No ${type === 'movies' ? 'Movies' : 'TV Shows'} available`;
                        helpElem.textContent = '';
                    }
                }

                // Show no results message and hide the grid
                noResultsDiv.classList.add('active');
                grid.style.display = 'none';

                /* This path renders no cards and leaves `view.data` holding the
                   previous selection's items, so the view is not a valid thing
                   to skip a render against. Saying so here rather than trusting
                   the signature: re-rendering an empty result costs nothing, and
                   the alternative is a skip that leaves a stale `view.data`
                   behind a grid the delegated click listener still reads from. */
                gridView(type).rendered = 0;

                return;
            }

            // We have results to display
            noResultsDiv.classList.remove('active');
            grid.style.display = 'grid';

            /* Render a window, not the library.

               The selection has changed, so this always starts at the top —
               a new search or sort showing its results from wherever the
               viewer happened to be scrolled would be wrong. The window then
               follows the scroll from there.

               Geometry has to be measured from a rendered card, so the first
               pass renders and the second pass sizes the spacers against real
               numbers. Both are cheap: it is one window either way. */
            const view = gridView(type);
            view.data = data;
            view.first = -1;

            measureGrid(view);
            renderWindow(view, 0, animateCards);

            if (!view.measured) {
                /* No card had been laid out yet, so the geometry was unknown
                   and the spacers were sized against nothing. Now one exists.

                   This branch is always taken for a tab being rendered for the
                   first time — no card of that type has ever been laid out — so
                   the first tab switch pays for two windows, not one. That is
                   the frame budget a slide is competing with.

                   The second pass STILL FAILS when this grid is hidden, which
                   is the ordinary case: `beginTabTransition()` renders the
                   incoming tab before it is displayed. That failure is now
                   recorded rather than mistaken for a measurement of zero, and
                   `endTabTransition()` takes it again once the tab has landed.
                   Rendering once from placeholder geometry is fine — nothing is
                   on screen to be wrong. Believing it afterwards was not. */
                if (measureGrid(view)) renderWindow(view, 0, animateCards);
            }
        }

        // Detail overlay. Open state lives in the Alpine scope; the close
        // button, backdrop and Escape are wired in the markup.

        // Function to open modal with media details
        function openModal(item, type) {
            // Set poster image
            const posterPath = type === 'movies' ?
                dataUrl('posters', 'movies', `${item.id}.jpg`) :
                dataUrl('posters', 'tvshows', `${item.id}.jpg`);

            const posterContainer = document.querySelector('.modal-poster');
            posterContainer.innerHTML = ''; // Clear existing content

            const posterImg = document.createElement('img');
            posterImg.src = posterPath;
            posterImg.alt = item.title;
            posterContainer.appendChild(posterImg);

            posterImg.onerror = function () {
                // Remove the failed image
                this.remove();

                // Create a large text placeholder
                const placeholder = document.createElement('div');
                placeholder.className = 'text-placeholder large';

                placeholder.innerHTML = `
                    <div class="media-name">${item.title}</div>
                `;

                posterContainer.appendChild(placeholder);
            };

            // Set backdrop image
            const backdropPath = type === 'movies' ?
                dataUrl('backdrops', 'movies', `${item.id}.jpg`) :
                dataUrl('backdrops', 'tvshows', `${item.id}.jpg`);

            const backdropElement = document.querySelector('.modal-backdrop-art');
            backdropElement.innerHTML = ''; // Clear any existing content
            backdropElement.style.backgroundImage = `url(${backdropPath})`;

            // Add error handling for backdrop
            const testImage = new Image();
            testImage.onload = function () {
                // Image loaded successfully, keep the backdrop
            };
            testImage.onerror = function () {
                // Image failed to load, remove background image
                backdropElement.style.backgroundImage = 'none';

                // Add text-based placeholder
                const backdropPlaceholder = document.createElement('div');
                backdropPlaceholder.className = 'backdrop-text-placeholder';

                if (type === 'movies') {
                    backdropPlaceholder.textContent = 'Movie';
                } else {
                    backdropPlaceholder.textContent = 'TV Show';
                }

                backdropElement.appendChild(backdropPlaceholder);
            };
            testImage.src = backdropPath;

            // Set title and year
            document.querySelector('.modal-title').textContent = item.title;
            document.querySelector('.modal-year').textContent = item.year || '';

            // Set metadata
            const ratingElem = document.getElementById('modal-rating');
            const durationElem = document.getElementById('modal-duration');

            // Handle content rating
            if (item.contentRating) {
                ratingElem.textContent = item.contentRating;
                ratingElem.style.display = 'block';
            } else {
                ratingElem.style.display = 'none';
            }

            // Handle duration (for movies) or episode/season count (for TV shows)
            if (type === 'movies' && item.duration) {
                // For movies, show duration in minutes
                const minutes = Math.floor(item.duration / 60000);
                durationElem.textContent = `${minutes} min`;
                durationElem.style.display = 'block';

                // Hide seasons element (in case it was visible from previous TV show)
                const seasonsElem = document.getElementById('modal-seasons');
                if (seasonsElem) {
                    seasonsElem.style.display = 'none';
                }

                // Hide episodes element (in case it was visible from previous TV show)
                const episodesElem = document.getElementById('modal-episodes');
                if (episodesElem) {
                    episodesElem.style.display = 'none';
                }
            } else if (type === 'tvshows') {
                // For TV shows, show seasons and episodes in separate containers

                // First, ensure the seasons element exists
                let seasonsElem = document.getElementById('modal-seasons');
                if (!seasonsElem) {
                    // Create a new element for seasons if it doesn't exist
                    seasonsElem = document.createElement('div');
                    seasonsElem.className = 'metadata-item';
                    seasonsElem.id = 'modal-seasons';

                    // Insert it before the duration element
                    durationElem.parentNode.insertBefore(seasonsElem, durationElem);
                }

                // Create or get the episodes element
                let episodesElem = document.getElementById('modal-episodes');
                if (!episodesElem) {
                    // Create a new element for episodes if it doesn't exist
                    episodesElem = document.createElement('div');
                    episodesElem.className = 'metadata-item';
                    episodesElem.id = 'modal-episodes';

                    // Insert it after the seasons element
                    seasonsElem.parentNode.insertBefore(episodesElem, seasonsElem.nextSibling);
                }

                // Hide the duration element for TV shows
                durationElem.style.display = 'none';

                // Handle season count
                if (item.childCount) {
                    seasonsElem.textContent = `${item.childCount} ${item.childCount === 1 ? 'season' : 'seasons'}`;
                    seasonsElem.style.display = 'block';
                } else {
                    seasonsElem.style.display = 'none';
                }

                // Handle episode count
                if (item.leafCount) {
                    episodesElem.textContent = `${item.leafCount} ${item.leafCount === 1 ? 'episode' : 'episodes'}`;
                    episodesElem.style.display = 'block';
                } else {
                    episodesElem.style.display = 'none';
                }
            } else {
                // Default case - hide all elements
                durationElem.style.display = 'none';

                const seasonsElem = document.getElementById('modal-seasons');
                if (seasonsElem) {
                    seasonsElem.style.display = 'none';
                }

                const episodesElem = document.getElementById('modal-episodes');
                if (episodesElem) {
                    episodesElem.style.display = 'none';
                }
            }

            // Set summary
            document.getElementById('modal-summary').textContent = item.summary || 'No summary available.';

            // Set genres
            const genresContainer = document.getElementById('modal-genres');
            genresContainer.innerHTML = '';

            if (item.genres && item.genres.length > 0) {
                item.genres.forEach(genre => {
                    const genreElement = document.createElement('div');
                    genreElement.className = 'genre-tag';
                    genreElement.textContent = genre;

                    // Add click event to filter by this genre when clicked
                    genreElement.addEventListener('click', () => {
                        setGenreFilter(genre);

                        // Close modal
                        closeModal();
                    });

                    genresContainer.appendChild(genreElement);
                });
            } else {
                // `.modal-prose` here too. This is bare text standing in a
                // slot that normally holds pills, so without it this is the one
                // path where the body's rhythm goes back to being uneven — and
                // it is the path nobody sees, which is why it would never be
                // reported. (Inside a flex container the margins do not
                // collapse; the trim shrinks the line box directly instead,
                // reaching the same result by the other mechanism.)
                genresContainer.innerHTML =
                    '<div class="modal-prose">No genres available</div>';
            }

            // Set cast
            const castContainer = document.getElementById('modal-cast');
            castContainer.innerHTML = '';

            if (item.actors && item.actors.length > 0) {
                item.actors.forEach(actor => {
                    const actorElement = document.createElement('div');
                    actorElement.className = 'cast-item';
                    actorElement.innerHTML = `
                        <div class="cast-name">${actor.name}</div>
                        <div class="cast-role">${actor.role || ''}</div>
                    `;
                    castContainer.appendChild(actorElement);
                });
            } else {
                // Prose, for the same reason as the no-genres line above.
                castContainer.innerHTML =
                    '<div class="modal-prose">No cast information available</div>';
            }

            // Add date added information
            const dateAdded = formatDate(item.addedAt);

            // Check if we already have the added date element
            let dateAddedElem = document.getElementById('modal-added-date');
            if (!dateAddedElem) {
                // Create a new section for date added
                const dateSection = document.createElement('div');
                dateSection.className = 'modal-section date-section';
                dateSection.innerHTML = `
                    <div class="modal-section-title">Date Added</div>
                    <div id="modal-added-date" class="modal-prose">${dateAdded}</div>
                `;
                document.querySelector('.modal .modal__body').appendChild(dateSection);
            } else {
                // Update existing date info
                dateAddedElem.textContent = dateAdded;
            }

            // A reused overlay keeps the previous item's scroll position, so
            // the next item opens part-way down its own summary.
            //
            // The three nested timeouts and the forced reflow that used to be
            // here were fighting the old presentation: the panel animated from a
            // transform, and reading scrollTop mid-animation on a phone gave the
            // pre-animation value. The panel no longer scrolls — its body does,
            // and the body is not what moves — so one reset before it is shown
            // is enough.
            const modalBody = document.querySelector('.modal .modal__body');
            if (modalBody) modalBody.scrollTop = 0;

            setOverlay('detailOpen', true);
        }

        /* The close button, backdrop click and Escape are all declared in the
           markup, and the scroll lock is the overlay system's. What was thirty
           lines of listeners is now this one function, kept because the rest of
           the file calls it by name. */
        function closeModal() {
            setOverlay('detailOpen', false);
        }

        // Initialize on page load.
        //
        // applyConfig() runs FIRST: it sets currentSortMethod from config.json,
        // and loadMedia() sorts as soon as the data arrives. Reversing these two
        // lines makes SORT_BY_DATE_ADDED apply only after the next interaction —
        // a bug that looks like the setting being ignored.
        if (!CONFIG) {
            reportConfigError('config.json could not be read or was not valid JSON.');
            // Abort the rest of this block. There is no top-level `return` in a
            // classic script, and continuing would run initialisation against a
            // body that has just been replaced by the error message. Later
            // script blocks guard on window.GLIMPSE.failed.
            window.GLIMPSE.failed = true;
            throw new Error('Glimpse: configuration unavailable; startup aborted.');
        }

        applyConfig();
        loadMedia();

        // Enhanced scroll to top button functionality
        const scrollToTopButton = document.querySelector('.scroll-to-top');

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                scrollToTopButton.classList.add('visible');
            } else {
                scrollToTopButton.classList.remove('visible');
            }
        });

        scrollToTopButton.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // Header scroll effect - shrink on scroll
        const header = document.querySelector('.header');
        let lastScrollTop = 0;

        window.addEventListener('scroll', () => {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

            if (scrollTop > 100) {
                header.style.boxShadow = '0 2px 15px rgba(0, 0, 0, 0.3)';
            } else {
                header.style.boxShadow = '0 2px 10px rgba(0, 0, 0, 0.2)';
            }

            lastScrollTop = scrollTop;
        });

        // ==========================================
        // SWIPE FUNCTIONALITY FOR MOBILE
        // ==========================================

        // Check if device is mobile
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 768;

        if (isMobile) {
            const container = document.querySelector('.container');

            /* The axis, resolved once per touch and then held:
                 null       not yet decided
                 'x'        ours — the tabs are following this finger
                 'y'        the scroller's, for the rest of this touch's life */
            let axis = null;
            let originX = 0;
            let originY = 0;

            /* There is no first-load tip any more.

               There used to be a toast reading "Swipe left or right to switch
               between Movies and TV Shows", two seconds after load. It existed
               because the gesture was undiscoverable: nothing moved until the
               finger lifted, so a viewer who half-swiped and saw nothing had no
               way to learn there was a gesture at all.

               A drag teaches itself. The page moves the moment the thumb does,
               and it moves back if you let go — which is both halves of the
               lesson, delivered by trying it rather than by being told. A toast
               explaining a gesture that demonstrates itself is noise. */
            /* ^ That reasoning was wrong and the tip is back.

               A drag only demonstrates itself to a viewer who already tries it.
               The gesture still has no visible affordance at rest, so removing
               the one thing that says it exists left it discoverable by accident
               only. What IS gone is the other toast — "Switched to TV Shows",
               after a commit — which was a caption for a transition that did not
               exist when it was written. The motion states that now, and states
               the direction with it. */
            const swipeIndicator = document.querySelector('.swipe-indicator');
            setTimeout(() => {
                swipeIndicator.textContent =
                    'Swipe left or right to switch between Movies and TV Shows';
                swipeIndicator.style.opacity = '1';
                setTimeout(() => {
                    swipeIndicator.style.opacity = '0';
                }, 3000);
            }, 2000);

            function touchInsideOverlay(target) {
                return !!(target && target.closest &&
                    target.closest('.sheet, .modal, .overlay-backdrop'));
            }

            /* Refused at touchstart, not at touchend.

               The old handler checked when the gesture was over, which is enough
               when nothing has moved. A drag that discovers the conflict later
               has already suppressed the browser's handling and taken both tabs
               out of the scroller. A touch inside an overlay belongs to that
               overlay — its own dismissal drag, a scroll in its body, or a
               backdrop tap — and never to the tabs behind it. */
            function gestureRefused(event) {
                return window.GlimpseOverlays.anyOverlayOpen() ||
                    touchInsideOverlay(event.target);
            }

            container.addEventListener('touchstart', event => {
                axis = null;
                if (event.touches.length !== 1 || gestureRefused(event)) {
                    axis = 'y';
                    return;
                }
                originX = event.touches[0].clientX;
                originY = event.touches[0].clientY;
                // Nothing else. A tap and a vertical scroll must both stay free.
            }, { passive: true });

            /* Non-passive from the start, and that is load-bearing.

               `preventDefault()` has to be available on the FIRST move that
               crosses the lock distance. A listener registered passive cannot
               call it at all, and on iOS a touch sequence whose early moves went
               uncancelled has already been handed to the scroller — where later
               attempts to cancel it are ignored, silently. The gesture then
               works everywhere except the platform it was written for. */
            container.addEventListener('touchmove', event => {
                if (axis === 'y' || event.touches.length !== 1) return;

                const x = event.touches[0].clientX;
                const y = event.touches[0].clientY;

                if (axis === null) {
                    const dx = x - originX;
                    const dy = y - originY;
                    if (Math.abs(dx) < TAB_AXIS_LOCK_PX && Math.abs(dy) < TAB_AXIS_LOCK_PX) {
                        return;
                    }
                    /* Decided once. A gesture that re-arbitrates mid-drag can
                       hand a moving page back to the scroller halfway through. */
                    if (Math.abs(dy) >= Math.abs(dx)) {
                        axis = 'y';
                        return;
                    }
                    axis = 'x';

                    const active = document.querySelector('.tab.active').dataset.content;
                    const forward = dx < 0;
                    const target = forward ? 'tvshows' : 'movies';
                    const outgoing = document.querySelector('.content.active');
                    /* Null when the drag is toward a tab that does not exist.
                       `beginTabDrag` resists rather than refusing: doing nothing
                       is indistinguishable from a gesture that was not
                       recognised, and the viewer is owed the difference. */
                    const incoming = active === target
                        ? null
                        : document.getElementById(`${target}-content`);

                    beginTabDrag(target, outgoing, incoming, forward ? 'forward' : 'back', originX);
                }

                event.preventDefault();
                trackTabDrag(x);
            }, { passive: false });

            container.addEventListener('touchend', () => {
                if (axis === 'x') settleTabDrag();
                axis = null;
            }, { passive: true });

            /* A system gesture or an incoming call ends the touch without a
               `touchend`. Without this the tabs stay pinned out of the scroller
               and the grid stays refusing to re-window — a page that will not
               scroll, with nothing on screen to explain it. */
            container.addEventListener('touchcancel', () => {
                if (axis === 'x') settleTabDrag();
                axis = null;
            }, { passive: true });
        }

        /**
         * Kept only because the markup has inline onclick="toggleServer()"
         * handlers. renderServerSwitcher() rebinds those buttons, so this runs
         * only for a path that missed rebinding; it delegates rather than
         * reimplementing the choice.
         *
         * Previously this hardcoded a Plex-to-Jellyfin swap and fell through to
         * a "SERVER_PATH/" placeholder for anything else — which meant a
         * Plex+Emby install navigated to a literal /SERVER_PATH/ and 404'd.
         */
        function toggleServer() {
            const others = otherServers();
            if (others.length > 0) {
                switchToServer(others[0].id);
            }
        }
    </script>

    <script>
        if (window.GLIMPSE.failed) { throw new Error('Glimpse: configuration unavailable.'); }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }

        // Add install prompt with PWA detection
        let deferredPrompt;
        const installButton = document.createElement('button');
        installButton.style.display = 'none';
        installButton.classList.add('install-button');
        installButton.textContent = 'Install App';

        // Function to check if app is running as PWA
        function isPWA() {
            // Check if running in standalone mode (most PWAs)
            if (window.matchMedia('(display-mode: standalone)').matches) {
                return true;
            }

            // Check for iOS Safari standalone mode
            if (window.navigator.standalone === true) {
                return true;
            }

            // Check for fullscreen mode (some PWAs)
            if (window.matchMedia('(display-mode: fullscreen)').matches) {
                return true;
            }

            return false;
        }

        // Function to hide install buttons
        function hideInstallButtons() {
            installButton.style.display = 'none';
            const mobileInstallButton = document.querySelector('.mobile-install-button');
            if (mobileInstallButton) {
                mobileInstallButton.style.display = 'none';
            }
        }

        // Function to show install buttons
        function showInstallButtons() {
            // Only show if not already running as PWA
            if (!isPWA()) {
                installButton.style.display = 'none';
                const mobileInstallButton = document.querySelector('.mobile-install-button');
                if (mobileInstallButton) {
                    mobileInstallButton.style.display = 'flex';
                }
            }
        }

        // Check if app is already running as PWA on load
        document.addEventListener('DOMContentLoaded', () => {
            if (isPWA()) {
                hideInstallButtons();
                console.log('App is running as PWA - hiding install buttons');
            }
        });

        // Listen for app installation
        window.addEventListener('appinstalled', (e) => {
            console.log('PWA was installed');
            hideInstallButtons();
            deferredPrompt = null;
        });

        // Get the mobile install button
        window.addEventListener('beforeinstallprompt', (e) => {
            /* Queried HERE, inside the handler, and not hoisted to module scope
               alongside `installButton`. The mobile copy lives in the Actions
               tray, which Alpine teleports into <body> when it initialises — so
               a module-scope query runs before the element exists and stores
               null forever. hideInstallButtons() and showInstallButtons() query
               at call time for the same reason. */
            const mobileInstallButton = document.querySelector('.mobile-install-button');

            // Don't show install prompt if already running as PWA
            if (isPWA()) {
                hideInstallButtons();
                return;
            }

            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;

            // Show both desktop and mobile install buttons
            showInstallButtons();

            // Get the logo section and h1 element for desktop button
            const logoSection = document.querySelector('.logo-section');

            // Insert the desktop button right after the h1 element inside the logo section
            if (!logoSection.contains(installButton)) {
                logoSection.appendChild(installButton);
            }

            // Handle install for both buttons
            const handleInstall = (e) => {
                // Hide both install buttons
                hideInstallButtons();

                // Show the install prompt
                deferredPrompt.prompt();

           A 16:9 embed letterboxes against its own container whenever the source
           is not exactly 16:9, and letterboxing against --surface reads as a
           rendering fault rather than as a frame. So the black is a property of
           the medium, not a theme choice, and it stops at this element: the
           panel around it is the app's surface like every other overlay's. See
           `.modal__panel--video` in overlays.css, which used to paint the whole
           panel black and is what made the head a different colour from the body
           in the first place.

           The WIDTH is capped by the height available, and it has to be the
           width. `max-height` on an aspect-ratio box clamps the height while the
           width goes on filling its container — which breaks the ratio and
           letterboxes the video inside its own well, silently, and only on the
           short viewports nobody checks. Deriving the width from the height
           budget keeps the box 16:9 at every size.

           88vh is `.modal__panel`'s own max-height. 120px is the panel chrome
           above and below this well, rounded up from the worst case: grip 17 +
           head 74 + body padding 20 = 111px on touch, 98px on a pointer where
           the grip is hidden but the head takes the 18px compensation. So the
           cap binds only on a short viewport — a landscape phone, or a 700px
           desktop window — which is exactly what it is for. On a normal desktop
           the 960px panel is the narrower constraint and this never applies. */
        .trailer-container {
            position: relative;
            width: min(100%, calc((88vh - 120px) * 16 / 9));
            aspect-ratio: 16 / 9;
            margin-inline: auto;
            overflow: hidden;
            background: #000;
            border-radius: var(--radius-md);
        }

        .trailer-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background-color: #000;
            /* Above the loading indicator, which is 5. */
            z-index: 10;
            /* Matched to the well's radius, and deliberately not left to the
               well's `overflow: hidden` alone: Safari does not reliably clip an
               iframe to a rounded ancestor. The two values must stay equal.

               A `box-shadow: 0 10px 30px` stood here too. It was inside that
               clipping container, so it was cut away on every side and had never
               once rendered — a declaration that looks like a live decision to
               everyone who reads it. */
            border-radius: var(--radius-md);
        }

        /* Drawn on the well's own black, OPAQUE rather than as a translucent
           wash over it. The two backgrounds are a pair and must stay equal.

           This was `rgba(26, 26, 26, 0.7)`, which composites over black to
           #121212 — so the loading area and the video were two different blacks
           with a visible seam between them, and the region changed colour at the
           instant the iframe faded in, which is the instant a viewer is looking
           hardest at it. */
        .trailer-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 0 20px;
            text-align: center;
            background: #000;
            /* Below the iframe, which is 10. */
            z-index: 5;
            border-radius: var(--radius-md);
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

           at 20% — so on Jellyfin and Emby the ring was drawn in another
           server's theme with nothing on screen or in the source to say so. The
           leading edge stays --primary-color: that is the part that SHOULD
           follow the accent, and already did.

           `spinner-rotate` is the app's existing keyframe. This rule carried a
           byte-identical second copy of it named `trailer-spin`.

           Not merged into `.loading-spinner` itself: that one's track is
           `rgba(0, 0, 0, 0.1)`, chosen for the poster placeholder's light
           --tab-bg, and it would be invisible on this black. Two spinners
           sitting on opposite surfaces are not one component. Only the
           duplicated keyframe was. */
        .trailer-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spinner-rotate 1s linear infinite;

           `display` would outrank the UA stylesheet's `[hidden]` and the state
           would silently stop switching. */
        .trailer-error-text {
            color: #ff4444;
            font-weight: 500;
        }

        .trailer-loading.hidden {
            opacity: 0;
            visibility: hidden;
        }

        if (window.GLIMPSE.failed) { throw new Error('Glimpse: configuration unavailable.'); }

            // Add the Watch Trailer button to the modal title section
            const modalTitleSection = document.querySelector('.modal-title-section');
            const modalActions = document.createElement('div');
            modalActions.className = 'modal-actions';
            modalActions.innerHTML = `
        <button class="watch-trailer-btn">
        <span class="trailer-icon" aria-hidden="true">
            <svg
            class="play-icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            >
            <path d="M8 5v14l11-7L8 5z" />
            </svg>
        </span>
        Watch Trailer
        </button>

            modalTitleSection.appendChild(modalActions);

            // The overlay's own close button, backdrop and Escape handling are
            // declared in the markup and call closeTrailer(); only the pieces
            // this code writes into are needed here.
            const trailerContainer = document.querySelector('.trailer-container');
            const trailerLoading = document.querySelector('.trailer-loading');
            const trailerPanel = document.querySelector('.modal__panel--video');
            const trailerTitle = document.getElementById('trailer-title');
            const trailerSpinner = trailerLoading.querySelector('.trailer-spinner');
            const trailerStatus = trailerLoading.querySelector('.trailer-loading-text');
            const trailerError = trailerLoading.querySelector('.trailer-error-text');

             * Name the overlay after the item it is about to play.
             *
             * The visible head shows the item alone; the panel's accessible name
             * carries "Trailer:" as well, so a screen reader hears both what kind
             * of overlay opened and which film. Prefixing the visible head
             * instead would spend the front of a truncated line on a word the
             * head already implies — and it IS truncated, deliberately: on touch
             * the head is part of the drag region, so it must not grow with a
             * long title. See the shared title rule in overlays.css.
             *
             * Both are set in one place because they must never disagree, and
             * called with no item to put the overlay back to its authored state.
             */

                const named = title ? (year ? title + ' (' + year + ')' : title) : 'Trailer';
                trailerTitle.textContent = named;
                trailerPanel.setAttribute('aria-label', title ? 'Trailer: ' + named : 'Trailer');
            }

             *

             * the error used to be written over .trailer-loading's innerHTML,
             * which destroyed the spinner, so closing had to rebuild it from a
             * string that duplicated the authored markup.
             */
            function showTrailerError(failed) {
                trailerSpinner.hidden = failed;
                trailerStatus.hidden = failed;
                trailerError.hidden = !failed;

            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 768;

            // Function to open trailer modal with the correct title and year
            function openTrailer(title, year) {
                // Name the overlay before it opens, so the head never shows the
                // previous item's title for a frame.
                setTrailerLabel(title, year);

                // Show the loading indicator
                showTrailerError(false);
                trailerLoading.classList.remove('hidden');

                // Clear previous iframe
                const existingIframe = trailerContainer.querySelector('iframe');
                if (existingIframe) {
                    existingIframe.remove();
                }

                setOverlay('trailerOpen', true);

                // Create iframe with the movie title AND year
                const encodedTitle = encodeURIComponent(title);
                const iframe = document.createElement('iframe');
                iframe.src = `https://tvtime.dev/glimpse?title=${encodedTitle}&year=${year}&embed=true&autoplay=true`;
                iframe.setAttribute('frameborder', '0');
                iframe.setAttribute('allowfullscreen', 'true');

                // Set initial opacity to 0
                iframe.style.opacity = '0';
                iframe.style.transition = 'opacity 0.3s ease';

                // Hand the well over to the video.
                //
                // Refused while the error line is showing. Both callers below
                // are unconditional timers, so without this the error is
                // uncovered by the 3s fallback a moment after it appears and the
                // failure state can never be read — a state that renders for an
                // instant and then hides itself is not a state anyone receives.
                function revealTrailer() {
                    if (!trailerError.hidden) return;
                    trailerLoading.classList.add('hidden');
                    iframe.style.opacity = '1';
                }

                // Add load event listener to hide the loading indicator
                iframe.onload = function () {
                    // Set a short delay before showing the iframe to wait for content inside to load
                    setTimeout(revealTrailer, 700);
                };

                // Add error event listener
                iframe.onerror = function () {
                    showTrailerError(true);
                };

                // Add the new iframe
                trailerContainer.appendChild(iframe);

                // Set a timeout to hide the loading indicator even if onload doesn't trigger
                // This can happen with some embedded content
                setTimeout(revealTrailer, 3000);
            }

            /**
             * Close the trailer and stop it playing.
             *
             * Removing the iframe is the part that matters: hiding the overlay
             * alone leaves a YouTube embed playing, so the user dismisses the
             * trailer and the audio carries on from nowhere. It is removed after
             * the leave transition so the video does not vanish mid-fade.
             *
             * No scroll-lock bookkeeping here any more. This used to restore
             * body overflow only if the detail overlay was not also open —
             * a condition that had to be right in two places. The overlay system
             * counts open overlays itself, so the page stays locked while the
             * detail overlay remains up.
             */
            function closeTrailer() {
                setOverlay('trailerOpen', false);

                setTimeout(() => {
                    if (isOverlayOpen('trailerOpen')) return;

                    trailerLoading.classList.remove('hidden');
                    showTrailerError(false);

                    // Back to the authored title. Left set, the next open would
                    // show the previous item's name for the frame before its own
                    // arrives.
                    setTrailerLabel(null, null);

                    const existingIframe = trailerContainer.querySelector('iframe');
                    if (existingIframe) existingIframe.remove();
                }, 300);

            window.closeTrailer = closeTrailer;

            // Store reference to the original openModal function
            const originalOpenModal = window.openModal;

            // Override the openModal function to add trailer button functionality
            window.openModal = function (item, type) {
                // Call the original function first
                originalOpenModal(item, type);

                // Get the trailer button
                const trailerBtn = document.querySelector('.watch-trailer-btn');

                // Only show the trailer button for movies, not TV shows
                if (type === 'movies') {
                    trailerBtn.style.display = 'flex';

                    // Focus moves to this button BEFORE the trailer opens.
                    // The trailer is raised from inside the detail overlay, and
                    // the focus manager records where focus was when it opened;
                    // if that is the document body — which is what a touch tap
                    // leaves behind — it declines to restore, and dismissing the
                    // trailer drops the keyboard user at the top of the page
                    // instead of back here. Nothing errors.
                    trailerBtn.onclick = () => {

                        openTrailer(item.title, item.year);
                    };

                }

            const originalCloseModal = window.closeModal;

            // Override the closeModal function to also close trailer modal if open
            window.closeModal = function () {

                // otherwise the trailer is left floating over the library with
                // nothing behind it, still playing.
                if (isOverlayOpen('trailerOpen')) {
                    closeTrailer();
                }
            };

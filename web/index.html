                             errors and the pointer path looks perfect. -->
                        <button class="sort-button genre-button"
                            @click="$refs.menuTrigger.focus(); menuOpen = false; genreOpen = true"
                            aria-haspopup="dialog">
                            <span class="sort-icon">🏷️ Genre</span>
                        </button>
                        <button class="sort-button server-toggle-button" x-ref="serverTriggerMobile">
                            <span class="server-icon">🔄</span>
                            <span class="server-text">Switch server</span>
                        </button>
                        <button class="sort-button install-button mobile-install-button"
                            @click="menuOpen = false">
                            <span class="install-icon">📱</span>
                            <span class="install-text">Install App</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ============ Genre tray ============
         One implementation, both widths. This replaces BOTH the desktop
         `.genre-menu` dropdown and the phone `.genre-drawer` — two
         implementations of one control, which is why every genre feature in
         this app had to be written twice. -->
    <div class="sheet" x-show="genreOpen" x-cloak style="display:none"
        x-transition:enter="overlay-opening" x-transition:enter-start="overlay-shut"
        x-transition:enter-end="overlay-shown" x-transition:leave="overlay-closing"
        x-transition:leave-start="overlay-shown" x-transition:leave-end="overlay-shut"
        @keydown.escape.window="genreOpen = false">
        <div class="sheet__backdrop" @click="genreOpen = false"></div>
        <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="Select genre"
            tabindex="-1">
            <div class="sheet__grip"><span class="sheet__handle"></span></div>
            <div class="sheet__head">
                <span class="sheet__title">Genre</span>
                <button class="overlay__close" @click="genreOpen = false"
                    aria-label="Close">×</button>
            </div>
            <div class="sheet__body genre-tray__body">
                <!-- Populated entirely by updateGenreList(), including the
                     all-genres entry — it is the first thing genreItem() builds.

                     An authored copy of that entry used to sit here, described
                     as "the one fixed member". It was not: updateGenreList()
                     clears this body before it fills it, so the markup was wiped
                     on every run and never seen. Worse, it was a bare <div> that
                     no code ever bound, so on the one path where the generated
                     list failed to arrive it would have offered a dead control
                     rather than an empty tray. -->
            </div>
        </div>
    </div>

    <!-- ============ Server switcher tray ============
         Shown only when three servers are configured; with two the header
         control is a direct toggle and this never opens. renderServerSwitcher()
         decides which. -->
    <div class="sheet" x-show="serverOpen" x-cloak style="display:none"
        x-transition:enter="overlay-opening" x-transition:enter-start="overlay-shut"
        x-transition:enter-end="overlay-shown" x-transition:leave="overlay-closing"
        x-transition:leave-start="overlay-shown" x-transition:leave-end="overlay-shut"
        @keydown.escape.window="serverOpen = false">
        <div class="sheet__backdrop" @click="serverOpen = false"></div>
        <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="Switch server"
            tabindex="-1">
            <div class="sheet__grip"><span class="sheet__handle"></span></div>
            <div class="sheet__head">
                <span class="sheet__title">Switch server</span>
                <button class="overlay__close" @click="serverOpen = false"
                    aria-label="Close">×</button>
            </div>
            <div class="sheet__body server-tray__body">
                <!-- Populated from config.json by renderServerSwitcher(). -->
            </div>
        </div>
    </div>

    <div class="container">
        <div id="movies-content" class="content active">
            <div class="loading">
                <div class="loading-spinner"></div>
            </div>
            <div class="no-results">
                <span class="no-results-icon">🔍</span>
                <h3 class="no-results-title">No results found</h3>
                <p class="no-results-message"></p>
                <p class="no-results-help"></p>
            </div>
            <div class="media-grid"></div>
        </div>

        <div id="tvshows-content" class="content">
            <div class="loading">
                <div class="loading-spinner"></div>
            </div>
            <div class="no-results">
                <span class="no-results-icon">🔍</span>
                <h3 class="no-results-title">No results found</h3>
                <p class="no-results-message"></p>
                <p class="no-results-help"></p>
            </div>
            <div class="media-grid"></div>
        </div>
    </div>

    <!-- Swipe Indicator -->
    <div class="swipe-indicator"></div>

    <!-- ============ Media detail ============
         A tray on a phone, a centred dialog on a pointer device — the
         `modal--tray-on-touch` modifier is what selects between them.

         The previous presentation was a centred box at every width, which put
         its close control in a top corner: the hardest part of a phone screen
         to reach one-handed, and the reason the tray shape exists. On touch the
         grab handle replaces that ×, and a downward swipe dismisses. -->
    <div class="modal modal--tray-on-touch" x-show="detailOpen" x-cloak style="display:none"
        x-transition:enter="overlay-opening" x-transition:enter-start="overlay-shut"
        x-transition:enter-end="overlay-shown" x-transition:leave="overlay-closing"
        x-transition:leave-start="overlay-shown" x-transition:leave-end="overlay-shut"
        @keydown.escape.window="detailOpen = false">
        <div class="modal__backdrop" @click="detailOpen = false"></div>
        <div class="modal__panel modal__panel--wide" role="dialog" aria-modal="true"
            aria-labelledby="detail-title" tabindex="-1">
            <!-- The FIXED region. Everything that identifies the item holds
                 still; only the prose below it scrolls.

                 It is a real element rather than `position: sticky` on the
                 poster block, and that is load-bearing twice over.

                 A sticky element is still inside the scroller, so
                 `touch-action: none` on it cannot be honoured — the browser
                 takes the downward drag back as a scroll, silently, which is the
                 trap `test_drag_regions_are_not_the_scroller` exists to catch.
                 And the artwork needs an element whose box it can fill; with a
                 sticky child there is nothing for it to key to, which is how it
                 ended up a hardcoded 280px that overshot the head by 214px and
                 sat behind scrolling content. -->
            <div class="modal__fixed">
                <div class="sheet__grip"><span class="sheet__handle"></span></div>
                <!-- The item's backdrop art. Absolutely positioned and inert; it
                     is texture, not content. `inset: 0` against this container
                     rather than a fixed height against the panel, so it cannot
                     reach the scrolling region for any content at any width. -->
                <div class="modal-backdrop-art" aria-hidden="true"></div>
                <div class="modal__head">
                    <h2 id="detail-title" class="modal-title">Title</h2>
                    <button class="overlay__close" @click="detailOpen = false"
                        aria-label="Close">×</button>
                </div>
                <div class="modal-header">
                    <div class="modal-poster">
                        <!-- Poster populated by openModal() -->
                    </div>
                    <div class="modal-title-section">
                        <div class="modal-year">2023</div>
                        <div class="modal-metadata">
                            <div class="metadata-item" id="modal-rating">PG-13</div>
                            <div class="metadata-item" id="modal-duration">120 min</div>
                        </div>
                        <div class="modal-actions"></div>
                    </div>
                </div>
            </div>
            <div class="modal__body">
                <div class="modal-section">
                    <div class="modal-section-title">Overview</div>
                    <div id="modal-summary" class="modal-prose">Loading summary...</div>
                </div>

                <div class="modal-section">
                    <div class="modal-section-title">Genres</div>
                    <div class="genres-list" id="modal-genres">
                        <!-- Genres populated by openModal() -->
                    </div>
                </div>

                <div class="modal-section">
                    <div class="modal-section-title">Cast</div>
                    <div class="cast-grid" id="modal-cast">
                        <!-- Cast populated by openModal() -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="scroll-to-top" aria-label="Scroll to top"></button>

    <script>
        // ============ CONFIG ADAPTER (continued) ============
        // The single configuration store. Read once, at boot, from the copy the
        // parser-blocking script in <head> already fetched — never re-fetched,
        // because configuration cannot change without a container restart and a
        // second read is only an opportunity for two parts of the app to
        // disagree about what it says.
        const CONFIG = window.GLIMPSE.config;
        const ACTIVE_SERVER = window.GLIMPSE.activeServer;

        /**
         * Report a configuration failure and stop.
         *
         * Deliberately NOT a fallback to defaults. A silent fallback here
         * reproduces exactly the failure this change removed: a misconfigured
         * install that looks like a working one, quietly showing the wrong
         * library — or an empty one indistinguishable from a server with no
         * media.
         */
        function reportConfigError(detail) {
            document.body.innerHTML =
                '<div class="config-error" role="alert">' +
                '<h2>Glimpse is not configured</h2>' +
                '<p>The application could not read <code>/config.json</code>, ' +
                'which the container generates at startup.</p>' +
                '<p>This usually means the entrypoint did not finish. Check the ' +
                'container logs with <code>docker logs glimpse-media-viewer</code>.</p>' +
                '<p><small>' + detail + '</small></p>' +
                '</div>';
        }

        /** The active server's entry from config.json. */
        function activeServerConfig() {
            return CONFIG.servers.find(server => server.id === ACTIVE_SERVER);
        }

        /**
         * Resolve a snapshot path for the active server.
         *
         * Absolute, always. This is what lets one index.html serve `/` and
         * `/jellyfin/` alike: a relative `data/...` resolves against the
         * document, so it would mean two different URLs on those two routes.
         * Rewriting every path per route is precisely what create_server_index()
         * existed to do, and why there were four copies of this file.
         */
        function dataUrl(...segments) {
            return '/' + activeServerConfig().dataPath + '/' + segments.join('/');
        }

        let moviesData = [];
        let tvShowsData = [];
        // Initial value; overwritten from config.json by applyConfig() below,
        // which is what the entrypoint used to do by substituting this line.
        let currentSortMethod = 'alpha'; // Default sorting method: 'alpha' or 'date'
        let currentGenre = 'all'; // Default genre filter: 'all' or specific genre
        let allGenres = { movies: {}, tvshows: {} }; // Store all unique genres and their counts
        let isMobileView = window.innerWidth < 992; // Track if we're in mobile view

        /**
         * Apply everything the entrypoint used to bake into this file with sed:
         * the title, the heading, the default sort, the icons, and the switcher.
         */
        function applyConfig() {
            const server = activeServerConfig();

            // Title carries the server name; the heading does not. Set from the
            // config rather than edited in place, so it never accumulates a
            // second server name the way repeated sed runs could.
            document.title = CONFIG.appTitle + ' - ' + server.name;

            const heading = document.querySelector('.logo-section h1');
            if (heading) {
                const logo = heading.querySelector('.logo-icon');
                heading.textContent = '';
                if (logo) heading.appendChild(logo);
                heading.appendChild(document.createTextNode(CONFIG.appTitle));
            }

            if (CONFIG.sortByDateAdded === true) {
                currentSortMethod = 'date';
            }

            applyServerIcons(server.id);
            renderServerSwitcher();
        }

        /**
         * Point the icons and logo at the active server's set.
         *
         * The one part of theming a custom property cannot express: a
         * <link rel="icon"> needs a real address. This is DOM work on a parsed
         * document — idempotent, and leaving nothing on disk — not sed over a
         * file.
         */
        function applyServerIcons(serverId) {
            const base = serverId === 'plex' ? '/images' : '/images/' + serverId;

            const icons = {
                'link[rel="apple-touch-icon"]': '/apple-touch-icon.png',
                'link[rel="icon"][sizes="32x32"]': '/favicon-32x32.png',
                'link[rel="icon"][sizes="16x16"]': '/favicon-16x16.png',
                'link[rel="icon"][sizes="192x192"]': '/android-chrome-192x192.png',
                'link[rel="icon"][sizes="512x512"]': '/android-chrome-592x592.png',
            };

            for (const [selector, file] of Object.entries(icons)) {
                const link = document.head.querySelector(selector);
                if (link) link.href = base + file;
            }

            const logo = document.querySelector('.logo-icon img');
            if (logo) logo.src = base + '/logo.png';

            // Keep the document's theme-color in step with the generated
            // manifest: they drive the same surfaces, so a disagreement shows
            // as a colour change when the app is installed.
            const themeColors = { plex: '#131313', jellyfin: '#101010', emby: '#0f1419' };
            const meta = document.head.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = themeColors[serverId];
        }

        /** Servers other than the active one — the switcher's destinations. */
        function otherServers() {
            return CONFIG.servers.filter(server => server.id !== ACTIVE_SERVER);
        }

        /** Where a server is browsed. The primary server lives at the root. */
        function serverPath(serverId) {
            return serverId === CONFIG.primaryServer ? '/' : '/' + serverId + '/';
        }

        /**
         * Show a switcher matching how many servers are configured: nothing for
         * one, a toggle for two, a menu for three.
         *
         * The markup carries SERVER_NAME placeholders that the entrypoint used
         * to substitute — and `toggleServer()` used to hardcode a Plex/Jellyfin
         * pair, so a Plex+Emby install could not switch back at all. Both are
         * fixed by driving this from config.json.
         */
        function renderServerSwitcher() {
            const others = otherServers();

            document.querySelectorAll('.server-toggle-button').forEach(button => {
                if (others.length === 0) {
                    // One server: there is nowhere to switch to. Remove the
                    // control rather than disabling it — a control that can
                    // never do anything is not unavailable, it is absent.
                    const wrapper = button.closest('.server-toggle');
                    (wrapper || button).remove();
                    return;
                }

                const target = others[0];
                const label = button.querySelector('.server-text');
                if (label) {
                    label.textContent = others.length === 1
                        ? 'Switch to ' + target.name
                        : 'Switch server';
                }

                button.classList.add('configured');
                const wrapper = button.closest('.server-toggle');
                if (wrapper) wrapper.classList.add('configured');

                if (others.length === 1) {
                    // Two servers: no choice to present, so present none.
                    button.onclick = () => switchToServer(target.id);
                    button.removeAttribute('aria-haspopup');
                } else {
                    button.setAttribute('aria-haspopup', 'dialog');
                    button.onclick = () => {
                        // Focus first, then close the Actions tray, then open
                        // this one — see the note on the genre trigger in the
                        // Actions tray markup. This button exists in both the
                        // header and that tray; from inside the tray, opening
                        // without moving focus first leaves the keyboard user
                        // at the top of the page when the server tray closes.
                        button.focus();
                        setOverlay('menuOpen', false);
                        setOverlay('serverOpen', true);
                    };
                }
            });

            populateServerTray(others);
        }

        /** Fill the server tray from config.json. */
        function populateServerTray(others) {
            const body = document.querySelector('.server-tray__body');
            if (!body) return;

            body.innerHTML = '';
            others.forEach(server => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'genre-item server-item';
                item.innerHTML = '<span class="genre-item__label"></span>';
                item.querySelector('.genre-item__label').textContent = server.name;
                item.addEventListener('click', () => switchToServer(server.id));
                body.appendChild(item);
            });
        }

        /**
         * Navigate to another server.
         *
         * No service-worker cache-clearing handshake any more: the cache is
         * keyed by server, so there is nothing to race. See sw.js.
         */
        function switchToServer(serverId) {
            window.location.href = serverPath(serverId);
        }
        // ============ END OF CONFIG ADAPTER ============

        // Function to check if device is mobile/tablet
        function checkMobileView() {
            isMobileView = window.innerWidth < 992;
            return isMobileView;
        }

        // Update on resize
        window.addEventListener('resize', checkMobileView);

        // Function to create text placeholders for missing images
        function createTextPlaceholder(container, title) {
            const placeholder = document.createElement('div');
            placeholder.className = 'text-placeholder';
            placeholder.innerHTML = `
                <div class="media-name">${title}</div>
            `;

            container.appendChild(placeholder);
            return placeholder;
        }

        // Format timestamp to readable date
        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        /* Poster paths whose image has loaded at least once this session.

           A window that moves rebuilds its cards, and a rebuilt card starts
           with no `src` — so its poster returns to a spinner and fades in
           again, over artwork the viewer is looking at and has already seen.
           This is what let the flicker be reported while scrolling BACK UP
           through posters that had finished loading seconds earlier.

           Holding the paths rather than the images: the browser's own cache
           holds the bytes, and `/data/` is served with a seven-day max-age, so
           a card built with its `src` already set paints from cache without an
           observer round trip, a load event, or a fade. Bounded by the number
           of distinct posters the viewer has actually scrolled past, not by
           library size. */
        const loadedPosters = new Set();

        // Set up Intersection Observer for lazy loading
        const imageObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const placeholder = img.parentElement.querySelector('.poster-placeholder');

                    img.onload = () => {
                        img.classList.add('loaded');
                        // Recorded where the load is already being watched, so
                        // no card gains a listener of its own for this.
                        loadedPosters.add(img.dataset.src);
                        if (placeholder) {
                            placeholder.style.opacity = '0';
                            setTimeout(() => {
                                if (placeholder) placeholder.remove();
                            }, 300);
                        }
                    };

                    img.onerror = () => {
                        // Get the media title from the parent item
                        const mediaItem = img.closest('.media-item');
                        const title = mediaItem.querySelector('.media-title').textContent;

                        // Create a text placeholder
                        const textPlaceholder = createTextPlaceholder(img.parentElement, title);

                        // Hide the loading placeholder and the img
                        if (placeholder) {
                            placeholder.style.opacity = '0';
                            setTimeout(() => {
                                if (placeholder) placeholder.remove();
                            }, 300);
                        }
                        img.style.display = 'none';
                    };

                    img.src = img.dataset.src;
                    imageObserver.unobserve(img);
                }
            });
        }, {
            rootMargin: '100px 0px',  // Load images 100px before they enter viewport
            threshold: 0.01
        });

        /**
         * Overlay open state lives in the Alpine scope on <body>.
         *
         * These helpers exist so the app's own code — which is not inside an
         * Alpine expression — can open and close overlays without reaching for
         * class toggles. The click-outside handlers, the "is it open" checks and
         * the manual class juggling that used to live here are all gone: a
         * backdrop click, Escape, and the swipe gesture are handled by the
         * overlay system itself.
         */
        function overlayScope() {
            return Alpine.$data(document.body);
        }

        function setOverlay(name, open) {
            // Alpine may not have initialised on a very early call; there is no
            // overlay to open yet in that case, so dropping it is correct.
            if (typeof Alpine === 'undefined') return;
            overlayScope()[name] = open;
        }

        function isOverlayOpen(name) {
            if (typeof Alpine === 'undefined') return false;
            return overlayScope()[name] === true;
        }

        /* ------------------------------------------------------------------
           Switching tabs

           Two paths, one set of state changes. The pointer path swaps
           instantly; the touch path slides the outgoing grid away in the
           direction of the swipe. Both drive `applyTabState()`, so a change to
           what a tab switch *means* cannot land in one and miss the other.

           The animated path exists because both tabs scroll as one document:
           they are siblings in `.container`, so two grids on screen at once
           necessarily share one `scrollY`, and the incoming tab has to show its
           top while the outgoing shows wherever the viewer was. The resolution
           is to take the outgoing tab out of the scroller — pinned with
           `position: fixed` and offset by the scroll position, it renders
           pixel-identical to where it already was but no longer responds to
           scrolling. The page is then set to 0 in the one frame nothing on
           screen reflects it. See `openspec/specs/media-browsing/spec.md`.

           MEASURED, 7,000 movies / 1,200 shows at 390x844, real Chromium over
           CDP. What the opening frame of the slide cost as each cause was
           removed — every frame AFTER the first was a clean 16.7ms throughout,
           so the slide was never slow; it was over before it was visible:

             | opening frame | cause removed                          |
             | 183.4ms       | (none — one rAF, fade on, no promotion)|
             |  83.3ms       | second rAF: render paints first        |
             |  16.7-33.4ms  | no card fade + will-change on setup    |

           Two things this rules OUT, so they are not re-investigated:

             - The transform is not the cost. A translateX on a box 1,228,722px
               tall holds 59.9fps with zero dropped frames, and bounding it to
               100vh changes nothing — measured both ways.
             - Neither is the first switch's double render. The ~120ms between
               the gesture and the slide is flat across the first, second and
               third switch. It is the per-switch filter, sort and render of the
               library, which the instant path has always paid too.

           Re-measure with `tools/grid_metrics.py` and a library seeded to
           thousands. A few-hundred-item fixture cannot fail any of this.
           ------------------------------------------------------------------ */

        /* Everything a tab switch changes that is not the visual swap. Both
           paths call this, and it never touches `.content` — which of the two
           containers is displayed is the one thing the paths do differently. */
        function applyTabState(contentName) {
            const currentSearchTerm = document.querySelector('.search-input').value.toLowerCase();

            // Update active tab (both mobile and desktop)
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.content === contentName);
            });

            // Check if the current genre exists in the new tab's genres
            if (currentGenre !== 'all' && !allGenres[contentName][currentGenre]) {
                // Reset genre filter if the genre doesn't exist in the new tab
                currentGenre = 'all';
                document.body.classList.remove('sort-by-genre');
            } else {
                // Keep the current genre selected
                document.body.classList.toggle('sort-by-genre', currentGenre !== 'all');
            }

            // Update the genre drawer and dropdown for the new tab
            updateGenreUI(contentName);

            // Close the Actions tray if it is open
            setOverlay('menuOpen', false);

            return currentSearchTerm;
        }

        // Function to switch tabs - UPDATED TO MAINTAIN GENRE FILTER
        function switchTab(contentName, direction) {
            const outgoing = document.querySelector('.content.active');
            const incoming = document.getElementById(contentName + '-content');

            // Nothing to switch to, and nothing to animate between.
            if (!incoming || outgoing === incoming) {
                const searchTerm = applyTabState(contentName);
                filterAndSortMedia(searchTerm, contentName);
                window.GlimpseOverlays.scrollPageTo(0);
                return;
            }

            if (shouldAnimateTabs() && direction) {
                switchTabAnimated(contentName, outgoing, incoming, direction);
                return;
            }

            const searchTerm = applyTabState(contentName);

            // Update active content
            document.querySelectorAll('.content').forEach(content => {
                content.classList.remove('active');
            });
            incoming.classList.add('active');

            // Apply the current search and sort to the newly selected tab content
            filterAndSortMedia(searchTerm, contentName);

            /* Scroll to top when switching tabs. Routed through the overlay
               system because `applyTabState()` admits an overlay may be open,
               and a direct scroll would be discarded in exactly that case. With
               nothing open this behaves identically. */
            window.GlimpseOverlays.scrollPageTo(0);
        }

        /* The animated path is enabled by the same `isMobile` the swipe
           listeners are bound behind, and by nothing else.

           Deliberately not a media query. Two conditions describing one
           capability drift: the rule hiding a page control and the rule showing
           the overlay trigger that replaced it were written as separate media
           queries here once, reached 992px and 768px independently, and left
           every width between them with neither. One condition cannot drift
           from itself, so there is no width where the gesture fires and the
           animation does not.

           `isMobile` is declared further down, in the swipe block — it is the
           gesture's flag, borrowed, which is the whole point. This is a
           function rather than a constant for that reason: it is called at
           swipe time, long after both have been evaluated. */
        function shouldAnimateTabs() {
            return typeof isMobile !== 'undefined' && isMobile;
        }

        /* Read from the stylesheet rather than restated here, so `tokens.css`
           stays the single source for every one of these numbers. */
        function readToken(name, fallback) {
            const raw = getComputedStyle(document.documentElement)
                .getPropertyValue(name).trim();
            const value = raw.endsWith('ms') ? parseFloat(raw)
                : raw.endsWith('s') ? parseFloat(raw) * 1000
                : parseFloat(raw);
            return Number.isFinite(value) ? value : fallback;
        }

        const TAB_TRANSITION_MS = readToken('--dur-tab', 280);
        const TAB_SETTLE_MIN_MS = readToken('--dur-tab-settle-min', 120);

        /* Where the gesture is claimed. Small enough to precede a scroll, large
           enough that a tap's jitter does not trip it.

           This is NOT the commit distance and the two must not be confused. The
           old handler used one number for both — it claimed the gesture only
           after 100px, which is far too late to drive a drag: nothing can move
           until the gesture is claimed, and on iOS a touch sequence whose early
           moves were not cancelled has already been given to the scroller, where
           later `preventDefault()` calls against it are ignored. */
        const TAB_AXIS_LOCK_PX = 8;

        /* Fraction of the viewport a drag must cross to commit on distance
           alone. The 100px the old handler used was a fixed pixel count on a
           screen whose width it did not know. */
        const TAB_COMMIT_FRACTION = 1 / 3;

        /* px/ms past which a release commits however short it was — a flick.
           Measured from the last few moves rather than the whole gesture: a slow
           drag ending in a flick is a flick, and averaging over the full
           duration erases exactly the intent this exists to read. */
        const TAB_FLICK_VELOCITY = 0.5;
        const TAB_VELOCITY_WINDOW_MS = 100;

        /* How far a drag toward a tab that does not exist actually travels.
           Enough to say "there is nothing here", not enough to suggest there is. */
        const TAB_RESIST_DAMPING = 0.25;

        /* THE live tab gesture — a drag or a slide from rest — or null.

           One record for both, deliberately. They share a setup, a teardown and
           every piece of state that teardown has to clear, and the drag is
           simply the slide with a finger in front of it. Two records would mean
           two teardowns, and the failure mode of the second one falling behind
           the first is a tab left pinned out of the scroller with the page
           unable to scroll and nothing on screen saying why.

           `drag` is the finger-specific part and is null for a slide from rest.

           An animation is presentation; the tab state it leaves behind is
           correctness, and that must never depend on a `transitionend`
           arriving. */
        let tabTransition = null;

        /* Read by everything that has to stand aside for a gesture: the grid's
           windowing, the idle re-warm, the resize handler. One predicate, so
           there is no second condition to drift from this one. */
        function tabGestureActive() {
            return tabTransition !== null;
        }

        /* Clears EVERYTHING either path sets, and is safe to call repeatedly.

           Enumerated rather than looped over, so adding a setup line without a
           matching teardown line is visible here rather than discovered as a
           page that will not scroll. */
        function endTabTransition() {
            if (!tabTransition) return;
            const { outgoing, incoming, onEnd, timer, frame, restoreY } = tabTransition;
            tabTransition = null;

            clearTimeout(timer);
            if (frame !== null) cancelAnimationFrame(frame);

            for (const panel of [outgoing, incoming]) {
                if (!panel) continue;
                /* Removed from BOTH panels rather than from the one that was
                   expected to fire. A commit watches the incoming tab and an
                   abandon watches the outgoing one, so a teardown that knows
                   which is which has to be kept in step with two call sites; one
                   that removes from both cannot fall out of step with either. */
                if (onEnd) panel.removeEventListener('transitionend', onEnd);
                panel.classList.remove(
                    'tab-leaving', 'tab-entering', 'tab-pinned', 'tab-sliding'
                );
                panel.style.removeProperty('--tab-shift');
                panel.style.removeProperty('--dur-tab-settling');
                /* All three of the pinned box, not just `top`. A tab left with
                   an inline `width` is a grid that keeps the column count it
                   had during the gesture, through every resize after it. */
                panel.style.removeProperty('top');
                panel.style.removeProperty('left');
                panel.style.removeProperty('width');
            }

            document.documentElement.classList.remove('tab-transitioning');

            /* An abandoned drag has to put the viewer back where they were.

               The order is the whole of it. Both tabs were pinned out of the
               scroller, which collapsed the document to viewport height and made
               the browser clamp scrollY to 0; un-pinning restores the full height
               with the page at the top of the library. The scroll must follow in
               the SAME synchronous block, with no paint between, or the viewer
               sees one frame at row 0.

               This forces a layout — the ~78ms hazard the freeze exists to avoid
               — and that is deliberate here. It lands after the settle has
               finished, on a frame where nothing is moving, which is the only
               place in this gesture that cost is affordable.

               Routed through the overlay system for the same reason every other
               scroll here is: a lock may hold the position. 'instant' because
               `scroll-behavior: smooth` would otherwise animate a correction
               that is supposed to be invisible. */
            if (restoreY !== null && restoreY !== undefined) {
                window.GlimpseOverlays.scrollPageTo(restoreY, 'instant');
            }

            /* The incoming tab is measured HERE, because this is the first
               moment it has ever been laid out.

               It was rendered in `beginTabTransition()` while it was still
               hidden and still not the active tab — deliberately, so that no
               part of it is visible before it holds its content — and a hidden
               grid cannot be measured. On a phone the tab pills are hidden
               below 768px, so the swipe is the ONLY way into the other tab:
               there was no route on that device that ever measured it. It
               rendered one window, its spacers collapsed, and the rest of the
               library sat beyond the end of the document. A rotation repaired
               it, because `resize` re-measures — which is how the defect was
               finally cornered, and why waiting for a resize is not a fix.

               Placed after the settle rather than in `commitTabState()` on
               purpose. This forces a layout, and the two-frame delay in
               `switchTabAnimated()` exists precisely to keep a layout of a
               fresh 120-card grid off the slide's opening frame — 183.4ms of a
               280ms animation, the last time that was got wrong. Here nothing
               is moving, which is the same reason the scroll restore above is
               allowed to force one. */
            const landed = activeGridView();
            if (landed && landed.data.length > 0 && measureGrid(landed)) {
                renderWindow(landed, desiredFirstIndex(landed), false);
            }
        }

        /* Take both tabs out of the scroller and render the incoming one.

           Shared by the drag and by a slide from rest, so the freeze exists in
           exactly one place. They differ in nothing here: a drag used to also
           raise the tabs off the page, and that lift is gone, so both paths now
           freeze identically and differ only in what moves them afterwards.

           Returns the record, with the incoming tab rendered, both panels
           pinned, and NOTHING yet moved.

           READ THE SCROLL POSITION BEFORE ANYTHING IS WRITTEN, AND READ NO
           GEOMETRY AT ALL AFTER THE FREEZE. Measured at library scale: setting
           the frozen styles costs 0.2-0.4ms, and a single
           `getBoundingClientRect()` afterwards costs 77.7ms — a forced
           synchronous layout landing on the gesture's first frame. The transform
           itself is free (59.9fps on a 1,228,722px box, zero dropped frames), so
           a hitch here reads as "the slide is janky" and the transform takes the
           blame. Do not add a measurement to this function. */
        /* Pin a tab at `viewportTop` on screen, IN ITS OWN BOX.
         *
         * All three of these are written, and `left`/`width` are the ones easily
         * mistaken for stylesheet constants. A fixed element does not inherit
         * `.container`'s padding, so a tab pinned with `left: 0; right: 0` is
         * the viewport's width rather than its own — measured at +20px, which
         * `auto-fill` hands to the cards. The grid grew when a thumb landed and
         * shrank when it lifted. The lift's scale used to cancel that almost
         * exactly, which is why it took the lift's removal to see it.
         *
         * `viewportTop` and `left` come from the caller's single pre-write rect.
         * The lesson from the origin this used to set outlives that code: on a
         * panel as tall as the whole library, what a transform or a pin does to
         * the PICTURE is the first question, not the last.
         */
        function pinTab(panel, viewportTop, left, width) {
            panel.style.top = `${viewportTop}px`;
            panel.style.left = `${left}px`;
            panel.style.width = `${width}px`;
        }

        function beginTabTransition(contentName, outgoing, incoming) {
            // Anything still in flight is resolved before a new one starts.
            endTabTransition();

            const y = window.scrollY;

            /* The tab's offset down the DOCUMENT, read here and nowhere later.
               `.content` starts below the header, so a tab pinned at `-y` sits
               that far too high — and the header's height is not a constant to
               hardcode, it shrinks on scroll.

               THIS READ IS SAFE AND THE ONE BELOW IT WOULD NOT BE. Layout is
               clean at this instant: the browser laid the page out for the last
               frame and nothing here has written a style yet, so this costs
               nothing. The 77.7ms figure is for a read AFTER a write, which
               forces a synchronous re-layout. The rule is not "never measure",
               it is "never measure something you just invalidated" — so this
               must stay above every write in this function. */
            const box = outgoing.getBoundingClientRect();
            const contentTop = box.top + y;

            const record = {
                outgoing,
                incoming,
                onEnd: null,
                timer: null,
                frame: null,
                drag: null,
                /* Null means "leave the page where the freeze put it", which is
                   0 — correct for a commit, because the incoming tab shows its
                   own top. An abandoned drag sets this to the captured offset. */
                restoreY: null,
                y,
            };
            tabTransition = record;

            const searchTerm = applyTabState(contentName);

            /* Render the incoming tab while it is still off screen and still
               not the active one. It has to hold its content before any of it
               is visible: a tab that has never been active has never been
               rendered, so it carries an empty grid and a live `.loading`
               spinner from first paint, and revealing it early shows that
               spinner rather than blank rows.

               Skipped outright when that tab is already showing exactly this —
               see `renderSignature()`. Measured at 7,000 items: 175.3ms to
               rebuild it against 1.4ms to establish it need not be. A drag pays
               this with a thumb on the glass, which is why the inactive tab is
               kept warm at idle rather than rebuilt here.

               No card entrance animation — see `filterAndSortMedia()`. */
            filterAndSortMedia(searchTerm, contentName, false);

            document.documentElement.classList.add('tab-transitioning');

            /* BOTH tabs leave the scroller, not just the outgoing one.

               The shipped transition froze only the outgoing tab and set the
               page to 0 immediately, because the incoming tab was still in flow
               and had to show its own top. A drag cannot do that: it can be
               abandoned, and a page already reset to 0 has discarded the
               position it must return to. Pinning both makes the document
               irrelevant for the gesture's duration, so the captured offset
               stays the only record of where the viewer was.

               A fixed element contributes no scrollable overflow, so pinning
               both collapses the document to viewport height and the browser
               clamps scrollY to 0 by itself. The explicit scroll below is kept
               anyway — see there.

               Both offsets are measured from `contentTop`, not from zero. The
               outgoing tab renders exactly where it already was; the incoming
               one shows its own top, which is `contentTop` with the page at 0. */
            pinTab(outgoing, contentTop - y, box.left, box.width);
            outgoing.classList.add('tab-leaving');
            /* The incoming tab takes the OUTGOING one's box, not its own. It is
               display:none at this instant, so it has no box of its own to
               read — and measuring it after the render above would be a forced
               layout on the gesture's first frame, the 77.7ms this function
               exists to avoid. They are siblings in the same container, so the
               box is the same one. */
            pinTab(incoming, contentTop, box.left, box.width);
            incoming.classList.add('tab-entering', 'tab-pinned');

            /* Both tabs are out of the scroller and the incoming one is off
               screen, so this moves nothing the viewer can see. That is what
               makes the change a single continuous movement instead of a jump
               followed by one. Routed through the overlay system because a lock
               may hold the position.

               KEPT rather than left to the browser's own clamping, which does
               reach the same 0. Clamping is a consequence of the collapsed
               document, so it is a behaviour to rely on rather than an
               instruction we gave — and the cost of it not happening is the
               incoming tab arriving at the outgoing one's scroll offset, which
               is precisely the failure the freeze exists to prevent. A no-op
               that states the intent is worth more than an assumption that
               usually holds. An abandoned drag overrides this at teardown.

               'instant' is required, not a preference. `scroll-behavior: smooth`
               is set on the document, so the default animates for about a second
               underneath a 280ms transition and is still travelling when it
               ends — the slide finishes and the page then drifts to the top on
               its own. Measured before this argument existed: the page was still
               at 3000px two frames in and settled at 12px, not 0. */
            window.GlimpseOverlays.scrollPageTo(0, 'instant');

            return record;
        }

        /* Hand the active class over and arm the teardown. Called at the point
           the gesture has decided which tab wins — immediately for a slide from
           rest, at release for a drag. */
        function commitTabState(record, contentName, durationMs) {
            const { incoming } = record;

            document.querySelectorAll('.content').forEach(content => {
                content.classList.remove('active');
            });
            incoming.classList.add('active');

            const onEnd = event => {
                // Only the panel's own transform, not a card's entrance fade.
                if (event.target === incoming && event.propertyName === 'transform') {
                    endTabTransition();
                }
            };
            incoming.addEventListener('transitionend', onEnd);
            record.onEnd = onEnd;

            /* Reduced motion collapses the duration app-wide rather than
               removing the transition, so `transitionend` still fires. This
               covers the case it does not — an interrupted or dropped
               transition must not strand a tab pinned and transformed. */
            record.timer = setTimeout(endTabTransition, durationMs + 120);
        }

        function switchTabAnimated(contentName, outgoing, incoming, direction) {
            const record = beginTabTransition(contentName, outgoing, incoming);

            // Which way the grids travel. A swipe left sends the outgoing tab
            // left and brings the incoming one in from the right.
            const shift = direction === 'forward' ? '-100%' : '100%';
            const from = direction === 'forward' ? '100%' : '-100%';

            incoming.style.setProperty('--tab-shift', from);

            commitTabState(record, contentName, TAB_TRANSITION_MS);

            /* TWO frames, not one, and the second is the load-bearing one.

               One frame is all the browser needs to have taken the starting
               transforms — that is what a card's entrance fade waits for. But
               the incoming tab's window was just built, and a rAF callback runs
               BEFORE that frame's layout and paint. Starting the transform in
               the first callback therefore puts the cost of laying out and
               painting a fresh 120-card grid on the animation's opening frame.

               Measured at library scale before this second frame existed: the
               slide's first frame took 183.4ms of its own 280ms, so two thirds
               of the animation was already over when it became visible. It read
               as a jump, and every frame after it was a clean 16.7ms — the
               transform was never the problem.

               The extra frame is invisible: the incoming tab is parked a full
               viewport to the side and the outgoing one has not begun to move,
               so nothing on screen has changed yet. */
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    if (!tabTransition) return;
                    outgoing.style.setProperty('--tab-shift', shift);
                    incoming.style.setProperty('--tab-shift', '0px');
                    outgoing.classList.add('tab-sliding');
                    incoming.classList.add('tab-sliding');
                });
            });
        }

        /* ------------------------------------------------------------------
           The tab drag

           The gesture IS the transition. `switchTabAnimated()` above plays a
           slide the viewer watches; this one hands them the tabs and lets them
           move them.

           Four phases, and only the second is expensive:

             touchstart      record the origin, claim nothing, do no work
             axis lock       decide the axis once, then SET UP  (~1.4ms, warm)
             track           two style writes per frame, read nothing
             release         commit, abandon, or spring back from a resisted end
           ------------------------------------------------------------------ */

        /* Where the incoming tab rests before it starts arriving: a FULL
           viewport out, on the side it comes from.

           A full viewport and not a fraction of one, so the two tabs are edge to
           edge and never overlap. The first version parked it a third of a
           viewport out and moved it at a third of the finger's speed — the
           iOS parallax — and the two grids then sat on top of each other for the
           whole gesture. Which one won was decided by document order, because
           both carry the same z-index and `#tvshows-content` comes second, so
           TV Shows painted over Movies in BOTH directions. It read as the drag
           always going the same way.

           Edge to edge, the question cannot arise: the tabs move together, one
           leaving exactly as fast as the other arrives, and they tile the
           viewport rather than sharing any part of it. */
        function parkOffset(direction, width) {
            return (direction === 'forward' ? 1 : -1) * width;
        }

        function beginTabDrag(contentName, outgoing, incoming, direction, startX) {
            const width = window.innerWidth;

            /* A drag toward a tab that does not exist still moves — it resists.
               Nothing is rendered or pinned for an incoming tab there is none
               of, so the whole setup is skipped and only the outgoing tab is
               taken out of the scroller. */
            const record = incoming
                ? beginTabTransition(contentName, outgoing, incoming)
                : beginResistedDrag(outgoing);

            record.drag = {
                contentName,
                direction,
                startX,
                width,
                offset: 0,
                /* {x, t} for the last few moves. Velocity is read from the END
                   of the gesture, not its average — a slow drag finishing in a
                   flick is a flick. */
                samples: [{ x: startX, t: performance.now() }],
                resisted: !incoming,
            };

            if (incoming) {
                incoming.style.setProperty('--tab-shift', `${parkOffset(direction, width)}px`);
            }
            return record;
        }

        /* The resisted case: one tab, pinned, with nothing to arrive.
           It shares the record shape so one teardown serves both. */
        function beginResistedDrag(outgoing) {
            endTabTransition();
            const y = window.scrollY;
            // Read before any write, exactly as in beginTabTransition().
            const box = outgoing.getBoundingClientRect();
            const contentTop = box.top + y;
            const record = {
                outgoing,
                incoming: null,
                onEnd: null,
                timer: null,
                frame: null,
                drag: null,
                restoreY: y,
                y,
            };
            tabTransition = record;

            document.documentElement.classList.add('tab-transitioning');
            pinTab(outgoing, contentTop - y, box.left, box.width);
            outgoing.classList.add('tab-leaving');
            return record;
        }

        /* One write pass per frame, however many moves arrived.

           `touchmove` fires at the digitiser's rate, which on a 120Hz panel is
           twice the frame rate. Writing on every one of them schedules style
           work the browser will discard, and does it on the frames that can
           least afford it.

           READS NOTHING. Same ban as the freeze, extended across every frame of
           the drag — where its cost would be paid sixty times rather than once.
           Everything needed was captured at lock: the origin, the width, the
           scroll offset. */
        function trackTabDrag(x) {
            const record = tabTransition;
            if (!record || !record.drag) return;

            const drag = record.drag;
            drag.offset = x - drag.startX;

            const now = performance.now();
            drag.samples.push({ x, t: now });
            while (drag.samples.length > 2 && now - drag.samples[0].t > TAB_VELOCITY_WINDOW_MS) {
                drag.samples.shift();
            }

            if (record.frame !== null) return;
            record.frame = requestAnimationFrame(() => {
                record.frame = null;
                if (tabTransition !== record) return;

                if (drag.resisted) {
                    record.outgoing.style.setProperty(
                        '--tab-shift', `${drag.offset * TAB_RESIST_DAMPING}px`
                    );
                    return;
                }

                /* Both tabs track the finger at the same rate, a viewport
                   apart. The pair moves as one strip: the outgoing tab's
                   trailing edge and the incoming tab's leading edge stay
                   exactly a viewport apart for the whole gesture, so one is
                   always replacing the other rather than covering it. */
                const park = parkOffset(drag.direction, drag.width);
                record.outgoing.style.setProperty('--tab-shift', `${drag.offset}px`);
                record.incoming.style.setProperty('--tab-shift', `${park + drag.offset}px`);
            });
        }

        function dragVelocity(drag) {
            const samples = drag.samples;
            if (samples.length < 2) return 0;
            const first = samples[0];
            const last = samples[samples.length - 1];
            const elapsed = last.t - first.t;
            return elapsed > 0 ? (last.x - first.x) / elapsed : 0;
        }

        /* Distance OR velocity, and never latched.

           A drag that passed the threshold and came back is an abandon. Latching
           would mean the tabs keep following a finger whose gesture has already
           been decided, which is the thing this whole change removes. */
        function dragCommits(drag) {
            if (drag.resisted) return false;

            const travelled = Math.abs(drag.offset);
            const towardIncoming = drag.direction === 'forward' ? drag.offset < 0 : drag.offset > 0;
            if (!towardIncoming) return false;

            if (travelled >= drag.width * TAB_COMMIT_FRACTION) return true;

            const velocity = dragVelocity(drag);
            const flickingToward = drag.direction === 'forward' ? velocity < 0 : velocity > 0;
            return flickingToward && Math.abs(velocity) >= TAB_FLICK_VELOCITY;
        }

        /* Timed from what is left to travel, not from a fixed duration.

           A fixed 280ms is wrong at both ends: a tab released at 95% spends the
           full time crossing the last sliver, and one released at 5% covers
           nearly the whole viewport in it. Floored so a near-complete drag still
           resolves visibly rather than snapping, and capped at `--dur-tab` so a
           commit from rest takes exactly as long as the transition did before
           this gesture existed. */
        function settleDuration(remaining, width) {
            const fraction = width > 0 ? Math.min(1, Math.abs(remaining) / width) : 1;
            return Math.max(TAB_SETTLE_MIN_MS, Math.round(TAB_TRANSITION_MS * fraction));
        }

        function settleTabDrag() {
            const record = tabTransition;
            if (!record || !record.drag) return;

            const drag = record.drag;
            const { outgoing, incoming } = record;

            if (record.frame !== null) {
                cancelAnimationFrame(record.frame);
                record.frame = null;
            }

            const commit = dragCommits(drag);
            const target = commit ? (drag.direction === 'forward' ? -drag.width : drag.width) : 0;
            const duration = settleDuration(target - drag.offset, drag.width);

            /* The finger is off the glass, so the tabs stop tracking it and
               start animating: `.tab-sliding` is what carries them home, over a
               duration set from the distance still to travel. */
            for (const panel of [outgoing, incoming]) {
                if (!panel) continue;
                panel.style.setProperty('--dur-tab-settling', `${duration}ms`);
                panel.classList.add('tab-sliding');
            }

            if (commit) {
                outgoing.style.setProperty('--tab-shift', `${target}px`);
                incoming.style.setProperty('--tab-shift', '0px');
                commitTabState(record, drag.contentName, duration);
                record.drag = null;
                return;
            }

            /* Abandoned. Both tabs go home and the viewer is returned to the
               scroll position the gesture started from — see `endTabTransition`
               for why the restore has to happen there rather than here. */
            outgoing.style.setProperty('--tab-shift', '0px');
            if (incoming) {
                incoming.style.setProperty(
                    '--tab-shift', `${parkOffset(drag.direction, drag.width)}px`
                );
                /* The tab that was arriving is not arriving. `applyTabState()`
                   already moved the tab controls, genre list and Actions tray to
                   it during setup, so they have to be moved back — the drag is
                   abandoned, not merely un-animated. */
                applyTabState(outgoing.id.replace('-content', ''));
            }
            record.restoreY = record.y;

            const finish = event => {
                if (event.target === outgoing && event.propertyName === 'transform') {
                    endTabTransition();
                }
            };
            outgoing.addEventListener('transitionend', finish);
            record.onEnd = finish;
            record.timer = setTimeout(endTabTransition, duration + 120);
            record.drag = null;
        }

        // Tab switching - update for both desktop and mobile tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                switchTab(tab.dataset.content);
            });
        });

        // Sort toggle functionality with direction support
        let sortDirection = {
            'alpha': 'asc',
            'date': 'desc'
        };

        function setSortMethod(method) {
            const previousMethod = currentSortMethod;

            // If clicking the same method, toggle direction
            if (method === previousMethod) {
                sortDirection[method] = sortDirection[method] === 'asc' ? 'desc' : 'asc';
            }

            currentSortMethod = method;

            // Update active state on all sort buttons
            document.querySelectorAll('.sort-button').forEach(btn => {
                if (btn.dataset.sort === method) {
                    btn.classList.add('active');

                    // Update the icon/text based on current direction
                    const iconSpan = btn.querySelector('.sort-icon');
                    if (method === 'alpha') {
                        iconSpan.textContent = sortDirection[method] === 'asc' ? 'A-Z' : 'Z-A';
                    } else if (method === 'date') {
                        iconSpan.textContent = sortDirection[method] === 'desc' ? '📅 Date Added ▼' : '📅 Date Added ▲';
                    }
                } else if (!btn.classList.contains('genre-button')) {
                    btn.classList.remove('active');
                }
            });

            // Update body class for styling
            if (method === 'date') {
                document.body.classList.add('sort-by-date');
                document.body.classList.remove('sort-by-genre');
            } else {
                document.body.classList.remove('sort-by-date');
            }

            // Reapply current search with new sorting
            const currentSearchTerm = document.querySelector('.search-input').value.toLowerCase();
            filterAndSortMedia(currentSearchTerm);
        }

        // Set the genre filter
        function setGenreFilter(genre) {
            currentGenre = genre;

            // Update active state in drawers and dropdowns
            document.querySelectorAll('.genre-item').forEach(item => {
                item.classList.toggle('active', item.dataset.genre === genre);
            });

            // Update genre button label and active state - for both desktop and mobile
            document.querySelectorAll('.genre-button').forEach(button => {
                if (genre !== 'all') {
                    // One label for every genre trigger now. The drawer button
                    // used to be special-cased to stay reading "Genre"; with a
                    // single control at both widths there is nothing to diverge.
                    button.innerHTML = `<span class="sort-icon">🏷️ <span class="selected-genre">${genre}</span></span>`;
                    button.classList.add('active');
                    document.body.classList.add('sort-by-genre');
                } else {
                    button.innerHTML = `<span class="sort-icon">🏷️ Genre</span>`;
                    button.classList.remove('active');
                    document.body.classList.remove('sort-by-genre');
                }
            });

            // Maintain the current sort method - keep Sort buttons active status
            document.querySelectorAll('.sort-button').forEach(btn => {
                if (btn.dataset.sort === currentSortMethod) {
                    btn.classList.add('active');
                } else if (!btn.classList.contains('genre-button')) {
                    btn.classList.remove('active');
                }
            });

            // Re-filter media with current search term and sort method
            const currentSearchTerm = document.querySelector('.search-input').value.toLowerCase();
            filterAndSortMedia(currentSearchTerm);

            // Choosing a genre dismisses the tray.
            setOverlay('genreOpen', false);
        }

        /**
         * Bind the sort controls.
         *
         * `onclick =` rather than addEventListener, and that is the whole reason
         * this is a function: assignment REPLACES, so running this pass twice
         * binds once. It has to be safe to re-run, because it is — see
         * bindRelocatedControls() below.
         */
        function bindSortButtons() {
            document.querySelectorAll('.sort-button').forEach(button => {
                if (!button.dataset.sort) return;  // The genre and server buttons share this class.
                button.onclick = () => {
                    setSortMethod(button.dataset.sort);

                    // Close the Actions tray if it is open
                    setOverlay('menuOpen', false);

                    /* Back to the top, so the new ordering is read from its
                       beginning. Routed through the overlay system rather than
                       scrolled directly: this same handler serves the header's
                       copy of the control and the Actions tray's, and from
                       inside the tray the page is pinned — a direct scrollTo
                       moves nothing and is then overwritten by the scroll lock
                       restoring where the user was. */
                    window.GlimpseOverlays.scrollPageTo(0);
                };
            });
        }

        bindSortButtons();

        /* Bind again once Alpine has finished initialising.
         *
         * THE PARSE-TIME PASS ABOVE CANNOT SEE THE ACTIONS TRAY. That tray is
         * authored inside `<template x-teleport="body">`, so until Alpine boots
         * it is inert template content that querySelectorAll does not reach —
         * and Alpine is a `defer` script, so it boots after this one has run to
         * completion. Every control in that tray was left with no handler at
         * all: the sort buttons carried only the Alpine `@click` that closes the
         * tray, and the server button carried nothing.
         *
         * The failure is invisible from every angle. Nothing throws. The tray
         * opens, the control highlights, the tray dismisses on tap — and the
         * grid does not change. It reports as "the mobile sort buttons do
         * nothing", which reads like a sorting bug rather than a wiring one.
         *
         * Note that only the BINDING passes were broken. Queries made at click
         * time reach the teleported markup fine, which is why tapping the
         * header's sort control correctly marks the tray's copy active too —
         * setSortMethod() queries when it runs. That divergence is what makes
         * this worth a comment: the tray looks wired because its state tracks.
         *
         * Both passes are idempotent, so the earlier calls stay where they are.
         * That is deliberate rather than lazy: if Alpine ever fails to load, the
         * header's controls still work, and the app degrades to a page without
         * overlays instead of a page without sorting. */
        function bindRelocatedControls() {
            bindSortButtons();
            renderServerSwitcher();
        }

        document.addEventListener('alpine:initialized', bindRelocatedControls);

        /* The desktop dropdown's positioning logic, the mobile drawer's open and
           close functions, the click-outside handler and the manual body-overflow
           toggle all lived here. All of it is gone.

           The genre filter is one tray now, opened declaratively by its trigger.
           Backdrop dismissal, Escape, the swipe gesture and the scroll lock come
           from the overlay system, so none of them is this file's problem — and
           the overflow-clamping fallback is not needed by an overlay that is
           centred or docked rather than anchored to a button. */

        /* No "refresh on open" hook. updateGenreUI() already runs on load and on
           every tab switch, which are the only two things that change the list,
           so the tray's contents are current before it can be opened. */

        // Function to extract and count all unique genres from media data
        function extractGenres(mediaData, type) {
            const genres = {};

            mediaData.forEach(item => {
                if (item.genres && Array.isArray(item.genres)) {
                    item.genres.forEach(genre => {
                        if (!genres[genre]) {
                            genres[genre] = 0;
                        }
                        genres[genre]++;
                    });
                }
            });

            // Sort genres alphabetically
            return Object.keys(genres)
                .sort()
                .reduce((result, key) => {
                    result[key] = genres[key];
                    return result;
                }, {});
        }
        /**
         * Build the genre tray's list for a content type.
         *
         * This replaces updateGenreDropdown() and updateGenreDrawer(), which
         * were the same function written twice — one for the desktop dropdown,
         * one for the phone drawer — and had already drifted: the drawer showed
         * counts the dropdown did not, and the two disagreed about how the
         * trigger should be labelled. One control, one builder.
         */
        function updateGenreList(type) {
            const genres = allGenres[type] || {};
            const body = document.querySelector('.genre-tray__body');
            if (!body) return;

            body.innerHTML = '';

            const total = Object.values(genres).reduce((sum, n) => sum + n, 0);
            body.appendChild(genreItem('all', 'All Genres', total));

            Object.keys(genres)
                .sort((a, b) => a.localeCompare(b))
                .forEach(genre => body.appendChild(genreItem(genre, genre, genres[genre])));

            updateGenreTriggers();
        }

        /** One row in the genre tray. */
        function genreItem(value, label, count) {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'genre-item' + (currentGenre === value ? ' active' : '');
            item.dataset.genre = value;
            // aria-pressed rather than a class alone: the active genre is state,
            // and a class is invisible to a screen reader.
            item.setAttribute('aria-pressed', String(currentGenre === value));
            item.innerHTML = `<span class="genre-item__label"></span>` +
                `<span class="genre-item__count"></span>`;
            item.querySelector('.genre-item__label').textContent = label;
            item.querySelector('.genre-item__count').textContent = count ? String(count) : '';

            item.addEventListener('click', () => {
                setGenreFilter(value);
                /* Through the overlay system: this control only ever exists
                   inside the genre tray, so the page is always pinned when it
                   runs. A direct scrollTo here moved nothing and was then
                   overwritten by the scroll lock restoring the old position. */
                window.GlimpseOverlays.scrollPageTo(0);
            });
            return item;
        }

        /** Label every genre trigger with the active selection. */
        function updateGenreTriggers() {
            document.querySelectorAll('.genre-button').forEach(button => {
                if (currentGenre !== 'all') {
                    button.innerHTML =
                        `<span class="sort-icon">🏷️ <span class="selected-genre"></span></span>`;
                    button.querySelector('.selected-genre').textContent = currentGenre;
                    button.classList.add('active');
                } else {
                    button.innerHTML = `<span class="sort-icon">🏷️ Genre</span>`;
                    button.classList.remove('active');
                }
            });
        }

        // Kept as the name the rest of the file calls.
        function updateGenreUI(type) {
            updateGenreList(type);
        }

        // Enhanced search functionality
        const searchInput = document.querySelector('.search-input');
        const searchClear = document.querySelector('.search-clear');

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filterAndSortMedia(searchTerm);

            // Toggle clear button visibility
            if (searchTerm) {
                searchClear.classList.add('visible');
            } else {
                searchClear.classList.remove('visible');
            }
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            filterAndSortMedia('');
            searchInput.focus();
        });

        // Load and display media data
        async function loadMedia() {
            try {
                // Load movies
                const moviesResponse = await fetch(dataUrl('movies.json'));
                moviesData = await moviesResponse.json();

                // Load TV shows
                const tvShowsResponse = await fetch(dataUrl('tvshows.json'));
                tvShowsData = await tvShowsResponse.json();

                // Extract genres
                allGenres.movies = extractGenres(moviesData, 'movies');
                allGenres.tvshows = extractGenres(tvShowsData, 'tvshows');

                // Initialize genre UI for both desktop and mobile
                updateGenreUI('movies');

                // Initial sort and display
                filterAndSortMedia('');
            } catch (error) {
                console.error('Error loading media data:', error);
                document.querySelector('#movies-content .loading').innerHTML =
                    '<div class="error">Failed to load movie data. Please try again later.</div>';
                document.querySelector('#tvshows-content .loading').innerHTML =
                    '<div class="error">Failed to load TV show data. Please try again later.</div>';
            }
        }

        // Function to remove articles for sorting
        function removeArticles(title) {
            // Convert to lowercase and trim spaces
            let cleanTitle = title.toLowerCase().trim();
            // Remove leading articles: "the ", "a ", "an "
            cleanTitle = cleanTitle.replace(/^(the|a|an)\s+/i, '');
            return cleanTitle;
        }

        // Natural sort comparison function for titles
        function naturalCompare(a, b) {
            const ax = removeArticles(a);
            const bx = removeArticles(b);

            // Natural sorting algorithm that handles numbers correctly
            const chunks = /(\d+|\D+)/g;
            const aChunks = String(ax).match(chunks);
            const bChunks = String(bx).match(chunks);

            // Check if either string doesn't match the pattern
            if (!aChunks || !bChunks) return ax.localeCompare(bx);

            const len = Math.min(aChunks.length, bChunks.length);

            // Compare each chunk
            for (let i = 0; i < len; i++) {
                // If both chunks are numeric
                if (!isNaN(aChunks[i]) && !isNaN(bChunks[i])) {
                    // Convert to numbers and compare
                    const numA = parseInt(aChunks[i], 10);
                    const numB = parseInt(bChunks[i], 10);
                    if (numA !== numB) {
                        return numA - numB;
                    }
                } else {
                    // Regular string comparison
                    const stringComp = aChunks[i].localeCompare(bChunks[i]);
                    if (stringComp !== 0) {
                        return stringComp;
                    }
                }
            }

            // If all chunks were equal but strings have different lengths
            return aChunks.length - bChunks.length;
        }

        // Sort media data
        function sortMedia(data, method) {
            if (method === 'alpha') {
                // Sort alphabetically by title, ignoring articles and handling numbers naturally
                const sorted = [...data].sort((a, b) => {
                    return naturalCompare(a.title, b.title);
                });

                // Reverse the order if direction is descending (Z-A)
                return sortDirection[method] === 'asc' ? sorted : sorted.reverse();
            } else if (method === 'date') {
                // Sort by date added
                if (sortDirection[method] === 'desc') {
                    // Newest first (descending)
                    return [...data].sort((a, b) => b.addedAt - a.addedAt);
                } else {
                    // Oldest first (ascending)
                    return [...data].sort((a, b) => a.addedAt - b.addedAt);
                }
            }
            return data;
        }

        /* Filter and sort media based on search term and sort method.

           `type` names the tab to render and defaults to the active one. It has
           to be a parameter rather than a read of `.tab.active`, because the tab
           transition renders the INCOMING tab before handing it the active
           class — the outgoing tab is still the active one at that point, so
           reading it there would re-render the tab being left and leave the
           arriving one empty.

           The local is deliberately not called `activeTab`: during a transition

                <div class="modal-section">
                    <div class="modal-section-title">Cast</div>
                    <div class="cast-grid" id="modal-cast">
                        <!-- Cast populated by openModal() -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="scroll-to-top" aria-label="Scroll to top"></button>

    <script>
        // ============ CONFIG ADAPTER (continued) ============
        // The single configuration store. Read once, at boot, from the copy the
        // parser-blocking script in <head> already fetched — never re-fetched,
        // because configuration cannot change without a container restart and a
        // second read is only an opportunity for two parts of the app to
        // disagree about what it says.
        const CONFIG = window.GLIMPSE.config;
        const ACTIVE_SERVER = window.GLIMPSE.activeServer;

        /**
         * Report a configuration failure and stop.
         *
         * Deliberately NOT a fallback to defaults. A silent fallback here
         * reproduces exactly the failure this change removed: a misconfigured
         * install that looks like a working one, quietly showing the wrong
         * library — or an empty one indistinguishable from a server with no
         * media.
         */
        function reportConfigError(detail) {
            document.body.innerHTML =
                '<div class="config-error" role="alert">' +
                '<h2>Glimpse is not configured</h2>' +
                '<p>The application could not read <code>/config.json</code>, ' +
                'which the container generates at startup.</p>' +
                '<p>This usually means the entrypoint did not finish. Check the ' +
                'container logs with <code>docker logs glimpse-media-viewer</code>.</p>' +
                '<p><small>' + detail + '</small></p>' +
                '</div>';
        }

        /** The active server's entry from config.json. */
        function activeServerConfig() {
            return CONFIG.servers.find(server => server.id === ACTIVE_SERVER);
        }

        /**
         * Resolve a snapshot path for the active server.
         *
         * Absolute, always. This is what lets one index.html serve `/` and
         * `/jellyfin/` alike: a relative `data/...` resolves against the
         * document, so it would mean two different URLs on those two routes.
         * Rewriting every path per route is precisely what create_server_index()
         * existed to do, and why there were four copies of this file.
         */
        function dataUrl(...segments) {
            return '/' + activeServerConfig().dataPath + '/' + segments.join('/');
        }

        let moviesData = [];
        let tvShowsData = [];
        // Initial value; overwritten from config.json by applyConfig() below,
        // which is what the entrypoint used to do by substituting this line.
        let currentSortMethod = 'alpha'; // Default sorting method: 'alpha' or 'date'
        let currentGenre = 'all'; // Default genre filter: 'all' or specific genre
        let allGenres = { movies: {}, tvshows: {} }; // Store all unique genres and their counts
        let isMobileView = window.innerWidth < 992; // Track if we're in mobile view

        /**
         * Apply everything the entrypoint used to bake into this file with sed:
         * the title, the heading, the default sort, the icons, and the switcher.
         */
        function applyConfig() {
            const server = activeServerConfig();

            // Title carries the server name; the heading does not. Set from the
            // config rather than edited in place, so it never accumulates a
            // second server name the way repeated sed runs could.
            document.title = CONFIG.appTitle + ' - ' + server.name;

            const heading = document.querySelector('.logo-section h1');
            if (heading) {
                const logo = heading.querySelector('.logo-icon');
                heading.textContent = '';
                if (logo) heading.appendChild(logo);
                heading.appendChild(document.createTextNode(CONFIG.appTitle));
            }

            if (CONFIG.sortByDateAdded === true) {
                currentSortMethod = 'date';
            }

            applyServerIcons(server.id);
            renderServerSwitcher();
        }

        /**
         * Point the icons and logo at the active server's set.
         *
         * The one part of theming a custom property cannot express: a
         * <link rel="icon"> needs a real address. This is DOM work on a parsed
         * document — idempotent, and leaving nothing on disk — not sed over a
         * file.
         */
        function applyServerIcons(serverId) {
            const base = serverId === 'plex' ? '/images' : '/images/' + serverId;

            const icons = {
                'link[rel="apple-touch-icon"]': '/apple-touch-icon.png',
                'link[rel="icon"][sizes="32x32"]': '/favicon-32x32.png',
                'link[rel="icon"][sizes="16x16"]': '/favicon-16x16.png',
                'link[rel="icon"][sizes="192x192"]': '/android-chrome-192x192.png',
                'link[rel="icon"][sizes="512x512"]': '/android-chrome-592x592.png',
            };

            for (const [selector, file] of Object.entries(icons)) {
                const link = document.head.querySelector(selector);
                if (link) link.href = base + file;
            }

            const logo = document.querySelector('.logo-icon img');
            if (logo) logo.src = base + '/logo.png';

            // Keep the document's theme-color in step with the generated
            // manifest: they drive the same surfaces, so a disagreement shows
            // as a colour change when the app is installed.
            const themeColors = { plex: '#131313', jellyfin: '#101010', emby: '#0f1419' };
            const meta = document.head.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = themeColors[serverId];
        }

        /** Servers other than the active one — the switcher's destinations. */
        function otherServers() {
            return CONFIG.servers.filter(server => server.id !== ACTIVE_SERVER);
        }

        /** Where a server is browsed. The primary server lives at the root. */
        function serverPath(serverId) {
            return serverId === CONFIG.primaryServer ? '/' : '/' + serverId + '/';
        }

        /**
         * Show a switcher matching how many servers are configured: nothing for
         * one, a toggle for two, a menu for three.
         *
         * The markup carries SERVER_NAME placeholders that the entrypoint used
         * to substitute — and `toggleServer()` used to hardcode a Plex/Jellyfin
         * pair, so a Plex+Emby install could not switch back at all. Both are
         * fixed by driving this from config.json.
         */
        function renderServerSwitcher() {
            const others = otherServers();

            document.querySelectorAll('.server-toggle-button').forEach(button => {
                if (others.length === 0) {
                    // One server: there is nowhere to switch to. Remove the
                    // control rather than disabling it — a control that can
                    // never do anything is not unavailable, it is absent.
                    const wrapper = button.closest('.server-toggle');
                    (wrapper || button).remove();
                    return;
                }

                const target = others[0];
                const label = button.querySelector('.server-text');
                if (label) {
                    label.textContent = others.length === 1
                        ? 'Switch to ' + target.name
                        : 'Switch server';
                }

                button.classList.add('configured');
                const wrapper = button.closest('.server-toggle');
                if (wrapper) wrapper.classList.add('configured');

                if (others.length === 1) {
                    // Two servers: no choice to present, so present none.
                    button.onclick = () => switchToServer(target.id);
                    button.removeAttribute('aria-haspopup');
                } else {
                    button.setAttribute('aria-haspopup', 'dialog');
                    button.onclick = () => {
                        // Focus first, then close the Actions tray, then open
                        // this one — see the note on the genre trigger in the
                        // Actions tray markup. This button exists in both the
                        // header and that tray; from inside the tray, opening
                        // without moving focus first leaves the keyboard user
                        // at the top of the page when the server tray closes.
                        button.focus();
                        setOverlay('menuOpen', false);
                        setOverlay('serverOpen', true);
                    };
                }
            });

            populateServerTray(others);
        }

        /** Fill the server tray from config.json. */
        function populateServerTray(others) {
            const body = document.querySelector('.server-tray__body');
            if (!body) return;

            body.innerHTML = '';
            others.forEach(server => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'genre-item server-item';
                item.innerHTML = '<span class="genre-item__label"></span>';
                item.querySelector('.genre-item__label').textContent = server.name;
                item.addEventListener('click', () => switchToServer(server.id));
                body.appendChild(item);
            });
        }

        /**
         * Navigate to another server.
         *
         * No service-worker cache-clearing handshake any more: the cache is
         * keyed by server, so there is nothing to race. See sw.js.
         */
        function switchToServer(serverId) {
            window.location.href = serverPath(serverId);
        }
        // ============ END OF CONFIG ADAPTER ============

        // Function to check if device is mobile/tablet
        function checkMobileView() {
            isMobileView = window.innerWidth < 992;
            return isMobileView;
        }

        // Update on resize
        window.addEventListener('resize', checkMobileView);

        // Function to create text placeholders for missing images
        function createTextPlaceholder(container, title) {
            const placeholder = document.createElement('div');
            placeholder.className = 'text-placeholder';
            placeholder.innerHTML = `
                <div class="media-name">${title}</div>
            `;

            container.appendChild(placeholder);
            return placeholder;
        }

        // Format timestamp to readable date
        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        // Set up Intersection Observer for lazy loading
        const imageObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const placeholder = img.parentElement.querySelector('.poster-placeholder');

                    img.onload = () => {
                        img.classList.add('loaded');
                        if (placeholder) {
                            placeholder.style.opacity = '0';
                            setTimeout(() => {
                                if (placeholder) placeholder.remove();
                            }, 300);
                        }
                    };

                    img.onerror = () => {
                        // Get the media title from the parent item
                        const mediaItem = img.closest('.media-item');
                        const title = mediaItem.querySelector('.media-title').textContent;

                        // Create a text placeholder
                        const textPlaceholder = createTextPlaceholder(img.parentElement, title);

                        // Hide the loading placeholder and the img
                        if (placeholder) {
                            placeholder.style.opacity = '0';
                            setTimeout(() => {
                                if (placeholder) placeholder.remove();
                            }, 300);
                        }
                        img.style.display = 'none';
                    };

                    img.src = img.dataset.src;
                    imageObserver.unobserve(img);
                }
            });
        }, {
            rootMargin: '100px 0px',  // Load images 100px before they enter viewport
            threshold: 0.01
        });

        /**
         * Overlay open state lives in the Alpine scope on <body>.
         *
         * These helpers exist so the app's own code — which is not inside an
         * Alpine expression — can open and close overlays without reaching for
         * class toggles. The click-outside handlers, the "is it open" checks and
         * the manual class juggling that used to live here are all gone: a
         * backdrop click, Escape, and the swipe gesture are handled by the
         * overlay system itself.
         */
        function overlayScope() {
            return Alpine.$data(document.body);
        }

        function setOverlay(name, open) {
            // Alpine may not have initialised on a very early call; there is no
            // overlay to open yet in that case, so dropping it is correct.
            if (typeof Alpine === 'undefined') return;
            overlayScope()[name] = open;
        }

        function isOverlayOpen(name) {
            if (typeof Alpine === 'undefined') return false;
            return overlayScope()[name] === true;
        }

        // Function to switch tabs - UPDATED TO MAINTAIN GENRE FILTER
        function switchTab(contentName) {
            // Get current search query before switching tabs
            const currentSearchTerm = document.querySelector('.search-input').value.toLowerCase();

            // Update active tab (both mobile and desktop)
            document.querySelectorAll('.tab').forEach(t => {
                if (t.dataset.content === contentName) {
                    t.classList.add('active');
                } else {
                    t.classList.remove('active');
                }
            });

            // Update active content
            document.querySelectorAll('.content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(contentName + '-content').classList.add('active');

            // Check if the current genre exists in the new tab's genres
            if (currentGenre !== 'all' && !allGenres[contentName][currentGenre]) {
                // Reset genre filter if the genre doesn't exist in the new tab
                currentGenre = 'all';
                document.body.classList.remove('sort-by-genre');
            } else {
                // Keep the current genre selected
                document.body.classList.toggle('sort-by-genre', currentGenre !== 'all');
            }

            // Update the genre drawer and dropdown for the new tab
            updateGenreUI(contentName);

            // Apply the current search and sort to the newly selected tab content
            filterAndSortMedia(currentSearchTerm);

            // Close the Actions tray if it is open
            setOverlay('menuOpen', false);

            /* Scroll to top when switching tabs. Routed through the overlay
               system because the line above admits an overlay may be open, and
               a direct scroll would be discarded in exactly that case. With
               nothing open this behaves identically. */
            window.GlimpseOverlays.scrollPageTo(0);
        }

        // Tab switching - update for both desktop and mobile tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                switchTab(tab.dataset.content);
            });
        });

        // Sort toggle functionality with direction support
        let sortDirection = {
            'alpha': 'asc',
            'date': 'desc'
        };

        function setSortMethod(method) {
            const previousMethod = currentSortMethod;

            // If clicking the same method, toggle direction
            if (method === previousMethod) {
                sortDirection[method] = sortDirection[method] === 'asc' ? 'desc' : 'asc';
            }

            currentSortMethod = method;

            // Update active state on all sort buttons
            document.querySelectorAll('.sort-button').forEach(btn => {
                if (btn.dataset.sort === method) {
                    btn.classList.add('active');

                    // Update the icon/text based on current direction
                    const iconSpan = btn.querySelector('.sort-icon');
                    if (method === 'alpha') {
                        iconSpan.textContent = sortDirection[method] === 'asc' ? 'A-Z' : 'Z-A';
                    } else if (method === 'date') {
                        iconSpan.textContent = sortDirection[method] === 'desc' ? '📅 Date Added ▼' : '📅 Date Added ▲';
                    }
                } else if (!btn.classList.contains('genre-button')) {
                    btn.classList.remove('active');
                }
            });

            // Update body class for styling
            if (method === 'date') {
                document.body.classList.add('sort-by-date');
                document.body.classList.remove('sort-by-genre');
            } else {
                document.body.classList.remove('sort-by-date');
            }

            // Reapply current search with new sorting
            const currentSearchTerm = document.querySelector('.search-input').value.toLowerCase();
            filterAndSortMedia(currentSearchTerm);
        }

        // Set the genre filter
        function setGenreFilter(genre) {
            currentGenre = genre;

            // Update active state in drawers and dropdowns
            document.querySelectorAll('.genre-item').forEach(item => {
                item.classList.toggle('active', item.dataset.genre === genre);
            });

            // Update genre button label and active state - for both desktop and mobile
            document.querySelectorAll('.genre-button').forEach(button => {
                if (genre !== 'all') {
                    // One label for every genre trigger now. The drawer button
                    // used to be special-cased to stay reading "Genre"; with a
                    // single control at both widths there is nothing to diverge.
                    button.innerHTML = `<span class="sort-icon">🏷️ <span class="selected-genre">${genre}</span></span>`;
                    button.classList.add('active');
                    document.body.classList.add('sort-by-genre');
                } else {
                    button.innerHTML = `<span class="sort-icon">🏷️ Genre</span>`;
                    button.classList.remove('active');
                    document.body.classList.remove('sort-by-genre');
                }
            });

            // Maintain the current sort method - keep Sort buttons active status
            document.querySelectorAll('.sort-button').forEach(btn => {
                if (btn.dataset.sort === currentSortMethod) {
                    btn.classList.add('active');
                } else if (!btn.classList.contains('genre-button')) {
                    btn.classList.remove('active');
                }
            });

            // Re-filter media with current search term and sort method
            const currentSearchTerm = document.querySelector('.search-input').value.toLowerCase();
            filterAndSortMedia(currentSearchTerm);

            // Choosing a genre dismisses the tray.
            setOverlay('genreOpen', false);
        }

        /**
         * Bind the sort controls.
         *
         * `onclick =` rather than addEventListener, and that is the whole reason
         * this is a function: assignment REPLACES, so running this pass twice
         * binds once. It has to be safe to re-run, because it is — see
         * bindRelocatedControls() below.
         */
        function bindSortButtons() {
            document.querySelectorAll('.sort-button').forEach(button => {
                if (!button.dataset.sort) return;  // The genre and server buttons share this class.
                button.onclick = () => {
                    setSortMethod(button.dataset.sort);

                    // Close the Actions tray if it is open
                    setOverlay('menuOpen', false);

                    /* Back to the top, so the new ordering is read from its
                       beginning. Routed through the overlay system rather than
                       scrolled directly: this same handler serves the header's
                       copy of the control and the Actions tray's, and from
                       inside the tray the page is pinned — a direct scrollTo
                       moves nothing and is then overwritten by the scroll lock
                       restoring where the user was. */
                    window.GlimpseOverlays.scrollPageTo(0);
                };
            });
        }

        bindSortButtons();

        /* Bind again once Alpine has finished initialising.
         *
         * THE PARSE-TIME PASS ABOVE CANNOT SEE THE ACTIONS TRAY. That tray is
         * authored inside `<template x-teleport="body">`, so until Alpine boots
         * it is inert template content that querySelectorAll does not reach —
         * and Alpine is a `defer` script, so it boots after this one has run to
         * completion. Every control in that tray was left with no handler at
         * all: the sort buttons carried only the Alpine `@click` that closes the
         * tray, and the server button carried nothing.
         *
         * The failure is invisible from every angle. Nothing throws. The tray
         * opens, the control highlights, the tray dismisses on tap — and the
         * grid does not change. It reports as "the mobile sort buttons do
         * nothing", which reads like a sorting bug rather than a wiring one.
         *
         * Note that only the BINDING passes were broken. Queries made at click
         * time reach the teleported markup fine, which is why tapping the
         * header's sort control correctly marks the tray's copy active too —
         * setSortMethod() queries when it runs. That divergence is what makes
         * this worth a comment: the tray looks wired because its state tracks.
         *
         * Both passes are idempotent, so the earlier calls stay where they are.
         * That is deliberate rather than lazy: if Alpine ever fails to load, the
         * header's controls still work, and the app degrades to a page without
         * overlays instead of a page without sorting. */
        function bindRelocatedControls() {
            bindSortButtons();
            renderServerSwitcher();
        }

        document.addEventListener('alpine:initialized', bindRelocatedControls);

        /* The desktop dropdown's positioning logic, the mobile drawer's open and
           close functions, the click-outside handler and the manual body-overflow
           toggle all lived here. All of it is gone.

           The genre filter is one tray now, opened declaratively by its trigger.
           Backdrop dismissal, Escape, the swipe gesture and the scroll lock come
           from the overlay system, so none of them is this file's problem — and
           the overflow-clamping fallback is not needed by an overlay that is
           centred or docked rather than anchored to a button. */

        /* No "refresh on open" hook. updateGenreUI() already runs on load and on
           every tab switch, which are the only two things that change the list,
           so the tray's contents are current before it can be opened. */

        // Function to extract and count all unique genres from media data
        function extractGenres(mediaData, type) {
            const genres = {};

            mediaData.forEach(item => {
                if (item.genres && Array.isArray(item.genres)) {
                    item.genres.forEach(genre => {
                        if (!genres[genre]) {
                            genres[genre] = 0;
                        }
                        genres[genre]++;
                    });
                }
            });

            // Sort genres alphabetically
            return Object.keys(genres)
                .sort()
                .reduce((result, key) => {
                    result[key] = genres[key];
                    return result;
                }, {});
        }
        /**
         * Build the genre tray's list for a content type.
         *
         * This replaces updateGenreDropdown() and updateGenreDrawer(), which
         * were the same function written twice — one for the desktop dropdown,
         * one for the phone drawer — and had already drifted: the drawer showed
         * counts the dropdown did not, and the two disagreed about how the
         * trigger should be labelled. One control, one builder.
         */
        function updateGenreList(type) {
            const genres = allGenres[type] || {};
            const body = document.querySelector('.genre-tray__body');
            if (!body) return;

            body.innerHTML = '';

            const total = Object.values(genres).reduce((sum, n) => sum + n, 0);
            body.appendChild(genreItem('all', 'All Genres', total));

            Object.keys(genres)
                .sort((a, b) => a.localeCompare(b))
                .forEach(genre => body.appendChild(genreItem(genre, genre, genres[genre])));

            updateGenreTriggers();
        }

        /** One row in the genre tray. */
        function genreItem(value, label, count) {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'genre-item' + (currentGenre === value ? ' active' : '');
            item.dataset.genre = value;
            // aria-pressed rather than a class alone: the active genre is state,
            // and a class is invisible to a screen reader.
            item.setAttribute('aria-pressed', String(currentGenre === value));
            item.innerHTML = `<span class="genre-item__label"></span>` +
                `<span class="genre-item__count"></span>`;
            item.querySelector('.genre-item__label').textContent = label;
            item.querySelector('.genre-item__count').textContent = count ? String(count) : '';

            item.addEventListener('click', () => {
                setGenreFilter(value);
                /* Through the overlay system: this control only ever exists
                   inside the genre tray, so the page is always pinned when it
                   runs. A direct scrollTo here moved nothing and was then
                   overwritten by the scroll lock restoring the old position. */
                window.GlimpseOverlays.scrollPageTo(0);
            });
            return item;
        }

        /** Label every genre trigger with the active selection. */
        function updateGenreTriggers() {
            document.querySelectorAll('.genre-button').forEach(button => {
                if (currentGenre !== 'all') {
                    button.innerHTML =
                        `<span class="sort-icon">🏷️ <span class="selected-genre"></span></span>`;
                    button.querySelector('.selected-genre').textContent = currentGenre;
                    button.classList.add('active');
                } else {
                    button.innerHTML = `<span class="sort-icon">🏷️ Genre</span>`;
                    button.classList.remove('active');
                }
            });
        }

        // Kept as the name the rest of the file calls.
        function updateGenreUI(type) {
            updateGenreList(type);
        }

        // Enhanced search functionality
        const searchInput = document.querySelector('.search-input');
        const searchClear = document.querySelector('.search-clear');

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filterAndSortMedia(searchTerm);

            // Toggle clear button visibility
            if (searchTerm) {
                searchClear.classList.add('visible');
            } else {
                searchClear.classList.remove('visible');
            }
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            filterAndSortMedia('');
            searchInput.focus();
        });

        // Load and display media data
        async function loadMedia() {
            try {
                // Load movies
                const moviesResponse = await fetch(dataUrl('movies.json'));
                moviesData = await moviesResponse.json();

                // Load TV shows
                const tvShowsResponse = await fetch(dataUrl('tvshows.json'));
                tvShowsData = await tvShowsResponse.json();

                // Extract genres
                allGenres.movies = extractGenres(moviesData, 'movies');
                allGenres.tvshows = extractGenres(tvShowsData, 'tvshows');

                // Initialize genre UI for both desktop and mobile
                updateGenreUI('movies');

                // Initial sort and display
                filterAndSortMedia('');
            } catch (error) {
                console.error('Error loading media data:', error);
                document.querySelector('#movies-content .loading').innerHTML =
                    '<div class="error">Failed to load movie data. Please try again later.</div>';
                document.querySelector('#tvshows-content .loading').innerHTML =
                    '<div class="error">Failed to load TV show data. Please try again later.</div>';
            }
        }

        // Function to remove articles for sorting
        function removeArticles(title) {
            // Convert to lowercase and trim spaces
            let cleanTitle = title.toLowerCase().trim();
            // Remove leading articles: "the ", "a ", "an "
            cleanTitle = cleanTitle.replace(/^(the|a|an)\s+/i, '');
            return cleanTitle;
        }

        // Natural sort comparison function for titles
        function naturalCompare(a, b) {
            const ax = removeArticles(a);
            const bx = removeArticles(b);

            // Natural sorting algorithm that handles numbers correctly
            const chunks = /(\d+|\D+)/g;
            const aChunks = String(ax).match(chunks);
            const bChunks = String(bx).match(chunks);

            // Check if either string doesn't match the pattern
            if (!aChunks || !bChunks) return ax.localeCompare(bx);

            const len = Math.min(aChunks.length, bChunks.length);

            // Compare each chunk
            for (let i = 0; i < len; i++) {
                // If both chunks are numeric
                if (!isNaN(aChunks[i]) && !isNaN(bChunks[i])) {
                    // Convert to numbers and compare
                    const numA = parseInt(aChunks[i], 10);
                    const numB = parseInt(bChunks[i], 10);
                    if (numA !== numB) {
                        return numA - numB;
                    }
                } else {
                    // Regular string comparison
                    const stringComp = aChunks[i].localeCompare(bChunks[i]);
                    if (stringComp !== 0) {
                        return stringComp;
                    }
                }
            }

            // If all chunks were equal but strings have different lengths
            return aChunks.length - bChunks.length;
        }

        // Sort media data
        function sortMedia(data, method) {
            if (method === 'alpha') {
                // Sort alphabetically by title, ignoring articles and handling numbers naturally
                const sorted = [...data].sort((a, b) => {
                    return naturalCompare(a.title, b.title);
                });

                // Reverse the order if direction is descending (Z-A)
                return sortDirection[method] === 'asc' ? sorted : sorted.reverse();
            } else if (method === 'date') {
                // Sort by date added
                if (sortDirection[method] === 'desc') {
                    // Newest first (descending)
                    return [...data].sort((a, b) => b.addedAt - a.addedAt);
                } else {
                    // Oldest first (ascending)
                    return [...data].sort((a, b) => a.addedAt - b.addedAt);
                }
            }
            return data;
        }

        // Filter and sort media based on search term and sort method
        function filterAndSortMedia(searchTerm) {
            const activeTab = document.querySelector('.tab.active').dataset.content;
            const data = activeTab === 'movies' ? moviesData : tvShowsData;

            // First filter by search term
            let filtered = data.filter(item =>
                item.title.toLowerCase().includes(searchTerm)
            );

            // Then filter by genre if necessary
            if (currentGenre !== 'all') {
                filtered = filtered.filter(item =>
                    item.genres && item.genres.includes(currentGenre)
                );
            }

            // Sort the filtered data using the current sort method
            const sortedData = sortMedia(filtered, currentSortMethod);

            // Display the sorted data
            displayMedia(sortedData, activeTab);
        }

        // Display media items with enhanced animations
        function displayMedia(data, type) {
            const contentDiv = document.querySelector(`#${type}-content`);
            const loadingDiv = contentDiv.querySelector('.loading');
            const grid = contentDiv.querySelector('.media-grid');
            const noResultsDiv = contentDiv.querySelector('.no-results');

            // Hide loading spinner
            loadingDiv.style.display = 'none';

            // Always start with an empty grid
            grid.innerHTML = '';

            // Check if there are no results to display
            if (data.length === 0) {
                // Get the current search term
                const searchTerm = document.querySelector('.search-input').value.trim();
                const messageElem = contentDiv.querySelector('.no-results-message');
                const helpElem = contentDiv.querySelector('.no-results-help');

                // Build the appropriate message based on whether there's a search term and/or genre filter
                if (currentGenre !== 'all') {
                    if (searchTerm) {
                        messageElem.innerHTML =
                            `We couldn't find any ${type === 'movies' ? 'Movies' : 'TV Shows'} 
                             in the "${currentGenre}" genre matching "<span class="search-term">${searchTerm}</span>"`;
                        helpElem.textContent = 'Try searching for something else or clearing your search';
                    } else {
                        messageElem.innerHTML =
                            `No ${type === 'movies' ? 'Movies' : 'TV Shows'} found in the "${currentGenre}" genre`;
                        helpElem.textContent = 'Try selecting a different genre';
                    }
                } else {
                    if (searchTerm) {
                        messageElem.innerHTML =
                            `We couldn't find any ${type === 'movies' ? 'Movies' : 'TV Shows'} 
                             matching "<span class="search-term">${searchTerm}</span>"`;
                        helpElem.textContent = 'Try searching for something else or clearing your search';
                    } else {
                        messageElem.innerHTML =
                            `No ${type === 'movies' ? 'Movies' : 'TV Shows'} available`;
                        helpElem.textContent = '';
                    }
                }

                // Show no results message and hide the grid
                noResultsDiv.classList.add('active');
                grid.style.display = 'none';

                return;
            }

            // We have results to display
            noResultsDiv.classList.remove('active');
            grid.style.display = 'grid';

            // Create and append items with staggered animation
            data.forEach((item, index) => {
                const mediaItem = document.createElement('div');
                mediaItem.className = 'media-item';
                mediaItem.dataset.id = item.id;
                mediaItem.dataset.type = type;
                mediaItem.style.opacity = '0';
                mediaItem.style.transition = `opacity 0.3s ease ${index * 0.03}s, transform 0.3s ease ${index * 0.03}s`;

                const posterPath = type === 'movies' ?
                    dataUrl('posters', 'movies', `${item.id}.jpg`) :
                    dataUrl('posters', 'tvshows', `${item.id}.jpg`);

                // Format the added date
                const addedDate = formatDate(item.addedAt);

                // Get primary genre if available
                const primaryGenre = item.genres && item.genres.length > 0 ? item.genres[0] : 'Unknown';

                mediaItem.innerHTML = `
                    <div class="poster-container">
                        <div class="poster-placeholder">
                            <div class="loading-spinner"></div>
                        </div>
                        <img data-src="${posterPath}" 
                             alt="${item.title}" 
                             class="poster">
                    </div>
                    <div class="media-info">
                        <div class="media-title">${item.title}</div>
                        <div class="media-year">${item.year}</div>
                        <div class="media-added">Added: ${addedDate}</div>
                    </div>
                `;

                grid.appendChild(mediaItem);

                // Trigger animation after a small delay
                setTimeout(() => {
                    mediaItem.style.opacity = '1';
                }, 10);

                // Observe the image for lazy loading
                const img = mediaItem.querySelector('.poster');
                imageObserver.observe(img);

                // Add click event to open modal
                mediaItem.addEventListener('click', () => {
                    openModal(item, type);
                });
            });
        }

        // Detail overlay. Open state lives in the Alpine scope; the close
        // button, backdrop and Escape are wired in the markup.

        // Function to open modal with media details
        function openModal(item, type) {
            // Set poster image
            const posterPath = type === 'movies' ?
                dataUrl('posters', 'movies', `${item.id}.jpg`) :
                dataUrl('posters', 'tvshows', `${item.id}.jpg`);

            const posterContainer = document.querySelector('.modal-poster');
            posterContainer.innerHTML = ''; // Clear existing content

            const posterImg = document.createElement('img');
            posterImg.src = posterPath;
            posterImg.alt = item.title;
            posterContainer.appendChild(posterImg);

            posterImg.onerror = function () {
                // Remove the failed image
                this.remove();

                // Create a large text placeholder
                const placeholder = document.createElement('div');
                placeholder.className = 'text-placeholder large';

                placeholder.innerHTML = `
                    <div class="media-name">${item.title}</div>
                `;

                posterContainer.appendChild(placeholder);
            };

            // Set backdrop image
            const backdropPath = type === 'movies' ?
                dataUrl('backdrops', 'movies', `${item.id}.jpg`) :
                dataUrl('backdrops', 'tvshows', `${item.id}.jpg`);

            const backdropElement = document.querySelector('.modal-backdrop-art');
            backdropElement.innerHTML = ''; // Clear any existing content
            backdropElement.style.backgroundImage = `url(${backdropPath})`;

            // Add error handling for backdrop
            const testImage = new Image();
            testImage.onload = function () {
                // Image loaded successfully, keep the backdrop
            };
            testImage.onerror = function () {
                // Image failed to load, remove background image
                backdropElement.style.backgroundImage = 'none';

                // Add text-based placeholder
                const backdropPlaceholder = document.createElement('div');
                backdropPlaceholder.className = 'backdrop-text-placeholder';

                if (type === 'movies') {
                    backdropPlaceholder.textContent = 'Movie';
                } else {
                    backdropPlaceholder.textContent = 'TV Show';
                }

                backdropElement.appendChild(backdropPlaceholder);
            };
            testImage.src = backdropPath;

            // Set title and year
            document.querySelector('.modal-title').textContent = item.title;
            document.querySelector('.modal-year').textContent = item.year || '';

            // Set metadata
            const ratingElem = document.getElementById('modal-rating');
            const durationElem = document.getElementById('modal-duration');

            // Handle content rating
            if (item.contentRating) {
                ratingElem.textContent = item.contentRating;
                ratingElem.style.display = 'block';
            } else {
                ratingElem.style.display = 'none';
            }

            // Handle duration (for movies) or episode/season count (for TV shows)
            if (type === 'movies' && item.duration) {
                // For movies, show duration in minutes
                const minutes = Math.floor(item.duration / 60000);
                durationElem.textContent = `${minutes} min`;
                durationElem.style.display = 'block';

                // Hide seasons element (in case it was visible from previous TV show)
                const seasonsElem = document.getElementById('modal-seasons');
                if (seasonsElem) {
                    seasonsElem.style.display = 'none';
                }

                // Hide episodes element (in case it was visible from previous TV show)
                const episodesElem = document.getElementById('modal-episodes');
                if (episodesElem) {
                    episodesElem.style.display = 'none';
                }
            } else if (type === 'tvshows') {
                // For TV shows, show seasons and episodes in separate containers

                // First, ensure the seasons element exists
                let seasonsElem = document.getElementById('modal-seasons');
                if (!seasonsElem) {
                    // Create a new element for seasons if it doesn't exist
                    seasonsElem = document.createElement('div');
                    seasonsElem.className = 'metadata-item';
                    seasonsElem.id = 'modal-seasons';

                    // Insert it before the duration element
                    durationElem.parentNode.insertBefore(seasonsElem, durationElem);
                }

                // Create or get the episodes element
                let episodesElem = document.getElementById('modal-episodes');
                if (!episodesElem) {
                    // Create a new element for episodes if it doesn't exist
                    episodesElem = document.createElement('div');
                    episodesElem.className = 'metadata-item';
                    episodesElem.id = 'modal-episodes';

                    // Insert it after the seasons element
                    seasonsElem.parentNode.insertBefore(episodesElem, seasonsElem.nextSibling);
                }

                // Hide the duration element for TV shows
                durationElem.style.display = 'none';

                // Handle season count
                if (item.childCount) {
                    seasonsElem.textContent = `${item.childCount} ${item.childCount === 1 ? 'season' : 'seasons'}`;
                    seasonsElem.style.display = 'block';
                } else {
                    seasonsElem.style.display = 'none';
                }

                // Handle episode count
                if (item.leafCount) {
                    episodesElem.textContent = `${item.leafCount} ${item.leafCount === 1 ? 'episode' : 'episodes'}`;
                    episodesElem.style.display = 'block';
                } else {
                    episodesElem.style.display = 'none';
                }
            } else {
                // Default case - hide all elements
                durationElem.style.display = 'none';

                const seasonsElem = document.getElementById('modal-seasons');
                if (seasonsElem) {
                    seasonsElem.style.display = 'none';
                }

                const episodesElem = document.getElementById('modal-episodes');
                if (episodesElem) {
                    episodesElem.style.display = 'none';
                }
            }

            // Set summary
            document.getElementById('modal-summary').textContent = item.summary || 'No summary available.';

            // Set genres
            const genresContainer = document.getElementById('modal-genres');
            genresContainer.innerHTML = '';

            if (item.genres && item.genres.length > 0) {
                item.genres.forEach(genre => {
                    const genreElement = document.createElement('div');
                    genreElement.className = 'genre-tag';
                    genreElement.textContent = genre;

                    // Add click event to filter by this genre when clicked
                    genreElement.addEventListener('click', () => {
                        setGenreFilter(genre);

                        // Close modal
                        closeModal();
                    });

                    genresContainer.appendChild(genreElement);
                });
            } else {
                genresContainer.innerHTML = '<div>No genres available</div>';
            }

            // Set cast
            const castContainer = document.getElementById('modal-cast');
            castContainer.innerHTML = '';

            if (item.actors && item.actors.length > 0) {
                item.actors.forEach(actor => {
                    const actorElement = document.createElement('div');
                    actorElement.className = 'cast-item';
                    actorElement.innerHTML = `
                        <div class="cast-name">${actor.name}</div>
                        <div class="cast-role">${actor.role || ''}</div>
                    `;
                    castContainer.appendChild(actorElement);
                });
            } else {
                castContainer.innerHTML = '<div>No cast information available</div>';
            }

            // Add date added information
            const dateAdded = formatDate(item.addedAt);

            // Check if we already have the added date element
            let dateAddedElem = document.getElementById('modal-added-date');
            if (!dateAddedElem) {
                // Create a new section for date added
                const dateSection = document.createElement('div');
                dateSection.className = 'modal-section date-section';
                dateSection.innerHTML = `
                    <div class="modal-section-title">Date Added</div>
                    <div id="modal-added-date">${dateAdded}</div>
                `;
                document.querySelector('.modal .modal__body').appendChild(dateSection);
            } else {
                // Update existing date info
                dateAddedElem.textContent = dateAdded;
            }

            // A reused overlay keeps the previous item's scroll position, so
            // the next item opens part-way down its own summary.
            //
            // The three nested timeouts and the forced reflow that used to be
            // here were fighting the old presentation: the panel animated from a
            // transform, and reading scrollTop mid-animation on a phone gave the
            // pre-animation value. The panel no longer scrolls — its body does,
            // and the body is not what moves — so one reset before it is shown
            // is enough.
            const modalBody = document.querySelector('.modal .modal__body');
            if (modalBody) modalBody.scrollTop = 0;

            setOverlay('detailOpen', true);
        }

        /* The close button, backdrop click and Escape are all declared in the
           markup, and the scroll lock is the overlay system's. What was thirty
           lines of listeners is now this one function, kept because the rest of
           the file calls it by name. */
        function closeModal() {
            setOverlay('detailOpen', false);
        }

        // Initialize on page load.
        //
        // applyConfig() runs FIRST: it sets currentSortMethod from config.json,
        // and loadMedia() sorts as soon as the data arrives. Reversing these two
        // lines makes SORT_BY_DATE_ADDED apply only after the next interaction —
        // a bug that looks like the setting being ignored.
        if (!CONFIG) {
            reportConfigError('config.json could not be read or was not valid JSON.');
            // Abort the rest of this block. There is no top-level `return` in a
            // classic script, and continuing would run initialisation against a
            // body that has just been replaced by the error message. Later
            // script blocks guard on window.GLIMPSE.failed.
            window.GLIMPSE.failed = true;
            throw new Error('Glimpse: configuration unavailable; startup aborted.');
        }

        applyConfig();
        loadMedia();

        // Enhanced scroll to top button functionality
        const scrollToTopButton = document.querySelector('.scroll-to-top');

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                scrollToTopButton.classList.add('visible');
            } else {
                scrollToTopButton.classList.remove('visible');
            }
        });

        scrollToTopButton.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // Header scroll effect - shrink on scroll
        const header = document.querySelector('.header');
        let lastScrollTop = 0;

        window.addEventListener('scroll', () => {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

            if (scrollTop > 100) {
                header.style.boxShadow = '0 2px 15px rgba(0, 0, 0, 0.3)';
            } else {
                header.style.boxShadow = '0 2px 10px rgba(0, 0, 0, 0.2)';
            }

            lastScrollTop = scrollTop;
        });

        // ==========================================
        // SWIPE FUNCTIONALITY FOR MOBILE
        // ==========================================

        // Check if device is mobile
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 768;

        if (isMobile) {
            // Variables to track swipe
            let touchStartX = 0;
            let touchEndX = 0;
            let touchStartY = 0;
            let touchEndY = 0;
            let swipeThreshold = 100; // Minimum distance to be considered a swipe
            let swipeAngleThreshold = 30; // Maximum angle in degrees to be considered a horizontal swipe

            // Get swipe indicator element
            const swipeIndicator = document.querySelector('.swipe-indicator');

            // Show swipe tip on first load for mobile users
            setTimeout(() => {
                swipeIndicator.textContent = 'Swipe left or right to switch between Movies and TV Shows';
                swipeIndicator.style.opacity = '1';

                // Hide the tip after 3 seconds
                setTimeout(() => {
                    swipeIndicator.style.opacity = '0';
                }, 3000);
            }, 2000);

            // Add touch event listeners to the container
            const container = document.querySelector('.container');

            container.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, false);

            container.addEventListener('touchmove', (e) => {
                // Prevent default only if we detect a significant horizontal movement
                // This allows vertical scrolling to continue working normally
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;

                const diffX = touchStartX - currentX;
                const diffY = touchStartY - currentY;

                // If horizontal movement is greater than vertical and exceeds threshold
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > swipeThreshold) {
                    e.preventDefault();
                }
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].clientX;
                touchEndY = e.changedTouches[0].clientY;
                handleSwipe();
            }, false);

            // Handle swipe gesture
            function handleSwipe() {
                // Calculate distances and angle
                const diffX = touchStartX - touchEndX;
                const diffY = touchStartY - touchEndY;
                const angle = Math.atan2(Math.abs(diffY), Math.abs(diffX)) * 180 / Math.PI;

                // Check if swipe is horizontal enough (angle less than threshold)
                if (angle < swipeAngleThreshold) {
                    // A swipe inside an overlay belongs to that overlay — the
                    // tray's own dismiss gesture, or a scroll in its body — not
                    // to the tab switcher behind it.
                    if (isOverlayOpen('detailOpen')) {
                        return;
                    }

                    // Get current active tab
                    const activeTab = document.querySelector('.tab.active').dataset.content;

                    // Calculate swipe distance and direction
                    const distance = Math.abs(diffX);

                    if (distance > swipeThreshold) {
                        let switched = false;

                        if (diffX > 0) {
                            // Swiped left, show TV Shows
                            if (activeTab === 'movies') {
                                switched = true;
                                swipeIndicator.textContent = 'Switched to TV Shows';
                                switchTab('tvshows');
                            }
                        } else {
                            // Swiped right, show Movies
                            if (activeTab === 'tvshows') {
                                switched = true;
                                swipeIndicator.textContent = 'Switched to Movies';
                                switchTab('movies');
                            }
                        }

                        // Only show the indicator if we actually switched tabs
                        if (switched) {
                            swipeIndicator.style.opacity = '0.9';

                            // Hide indicator after 1.5 seconds
                            setTimeout(() => {
                                swipeIndicator.style.opacity = '0';
                            }, 1500);
                        }
                    }
                }
            }
        }

        /**
         * Kept only because the markup has inline onclick="toggleServer()"
         * handlers. renderServerSwitcher() rebinds those buttons, so this runs
         * only for a path that missed rebinding; it delegates rather than
         * reimplementing the choice.
         *
         * Previously this hardcoded a Plex-to-Jellyfin swap and fell through to
         * a "SERVER_PATH/" placeholder for anything else — which meant a
         * Plex+Emby install navigated to a literal /SERVER_PATH/ and 404'd.
         */
        function toggleServer() {
            const others = otherServers();
            if (others.length > 0) {
                switchToServer(others[0].id);
            }
        }

        let deferredPrompt;
        const installButton = document.createElement('button');
        installButton.style.display = 'none';
        installButton.classList.add('install-button');
        installButton.textContent = 'Install App';

        // Function to check if app is running as PWA
        function isPWA() {
            // Check if running in standalone mode (most PWAs)
            if (window.matchMedia('(display-mode: standalone)').matches) {
                return true;
            }

            // Check for iOS Safari standalone mode
            if (window.navigator.standalone === true) {
                return true;
            }

            // Check for fullscreen mode (some PWAs)
            if (window.matchMedia('(display-mode: fullscreen)').matches) {
                return true;
            }

            return false;
        }

        // Function to hide install buttons
        function hideInstallButtons() {
            installButton.style.display = 'none';
            const mobileInstallButton = document.querySelector('.mobile-install-button');
            if (mobileInstallButton) {
                mobileInstallButton.style.display = 'none';
            }
        }

        // Function to show install buttons
        function showInstallButtons() {
            // Only show if not already running as PWA
            if (!isPWA()) {
                installButton.style.display = 'none';
                const mobileInstallButton = document.querySelector('.mobile-install-button');
                if (mobileInstallButton) {
                    mobileInstallButton.style.display = 'flex';
                }
            }
        }

        // Check if app is already running as PWA on load
        document.addEventListener('DOMContentLoaded', () => {
            if (isPWA()) {
                hideInstallButtons();
                console.log('App is running as PWA - hiding install buttons');
            }
        });

        // Listen for app installation
        window.addEventListener('appinstalled', (e) => {
            console.log('PWA was installed');
            hideInstallButtons();
            deferredPrompt = null;
        });

        // Get the mobile install button
        window.addEventListener('beforeinstallprompt', (e) => {
            /* Queried HERE, inside the handler, and not hoisted to module scope
               alongside `installButton`. The mobile copy lives in the Actions
               tray, which Alpine teleports into <body> when it initialises — so
               a module-scope query runs before the element exists and stores
               null forever. hideInstallButtons() and showInstallButtons() query
               at call time for the same reason. */
            const mobileInstallButton = document.querySelector('.mobile-install-button');

            // Don't show install prompt if already running as PWA
            if (isPWA()) {
                hideInstallButtons();
                return;
            }

            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;

            // Show both desktop and mobile install buttons
            showInstallButtons();

            // Get the logo section and h1 element for desktop button
            const logoSection = document.querySelector('.logo-section');

            // Insert the desktop button right after the h1 element inside the logo section
            if (!logoSection.contains(installButton)) {
                logoSection.appendChild(installButton);
            }

            // Handle install for both buttons
            const handleInstall = (e) => {
                // Hide both install buttons
                hideInstallButtons();

                // Show the install prompt
                deferredPrompt.prompt();

                // Wait for the user to respond to the prompt
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    } else {
                        console.log('User dismissed the install prompt');
                        // Show buttons again if user dismissed
                        setTimeout(() => {
                            if (!isPWA()) {
                                showInstallButtons();
                            }
                        }, 1000);
                    }
                    deferredPrompt = null;
                });
            };

            // Remove any existing event listeners to avoid duplicates
            installButton.replaceWith(installButton.cloneNode(true));
            const newInstallButton = document.querySelector('.install-button');

            newInstallButton.addEventListener('click', handleInstall);

            if (mobileInstallButton) {
                // Clone mobile button to remove existing listeners
                const newMobileButton = mobileInstallButton.cloneNode(true);
                mobileInstallButton.parentNode.replaceChild(newMobileButton, mobileInstallButton);

                newMobileButton.addEventListener('click', (e) => {
                    handleInstall(e);
                    setOverlay('menuOpen', false);
                });

        });

        window.addEventListener('focus', () => {

            }

        // Check when page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isPWA()) {
                hideInstallButtons();
            }
        });

        const style = document.createElement('style');
        style.textContent = `
            .install-button {
                color: #000;
                border: none;
                border-radius: 20px;
                padding: 8px 15px;
                cursor: pointer;
                margin-left: 15px;
                transition: background-color 0.3s;
                align-self: center;
                display: none;
            }
            .install-button:hover {
                background-color: var(--primary-hover);
            }
            .logo-section {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            
            /* The install button inside the Actions overlay. Width, centring and
               padding come from the .sheet__body rules in the authored
               stylesheet; what is left here is the colour and the cancellation
               of .install-button's own margin-left.

               No margin-top: the overlay's list is a flex column with its own
               gap, and an extra margin here spaced this one control 20px from
               its neighbour where every other pair sat at 10px. */
            .mobile-install-button {
                color: #fff !important;

            }

                .install-button:not(.mobile-install-button) {
                    display: none !important;
                }
            }
        `;
        document.head.appendChild(style);

    <script>
        if (window.GLIMPSE.failed) { throw new Error('Glimpse: configuration unavailable.'); }

            const modalActions = document.createElement('div');
            modalActions.className = 'modal-actions';
            modalActions.innerHTML = `

            </svg>

        Watch Trailer

`;
            modalTitleSection.appendChild(modalActions);

            // The overlay's own close button, backdrop and Escape handling are
            // declared in the markup and call closeTrailer(); only the pieces
            // this code writes into are needed here.
            const trailerContainer = document.querySelector('.trailer-container');
            const trailerLoading = document.querySelector('.trailer-loading');

            // Check if we're on a mobile device
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 768;

            // Function to open trailer modal with the correct title and year
            function openTrailer(title, year) {
                // Show the loading indicator
                trailerLoading.classList.remove('hidden');

                // Clear previous iframe
                const existingIframe = trailerContainer.querySelector('iframe');
                if (existingIframe) {
                    existingIframe.remove();
                }

                setOverlay('trailerOpen', true);

                // Create iframe with the movie title AND year
                const encodedTitle = encodeURIComponent(title);
                const iframe = document.createElement('iframe');
                iframe.src = `https://tvtime.dev/glimpse?title=${encodedTitle}&year=${year}&embed=true&autoplay=true`;
                iframe.setAttribute('frameborder', '0');
                iframe.setAttribute('allowfullscreen', 'true');

                // Set initial opacity to 0
                iframe.style.opacity = '0';
                iframe.style.transition = 'opacity 0.3s ease';

                // Add load event listener to hide the loading indicator
                iframe.onload = function () {
                    // Set a short delay before showing the iframe to wait for content inside to load
                    setTimeout(() => {
                        // Hide the loading indicator
                        trailerLoading.classList.add('hidden');

                        // Show the iframe
                        iframe.style.opacity = '1';
                    }, 700); // Short delay for better user experience - adjust if needed
                };

                // Add error event listener
                iframe.onerror = function () {
                    // Update loading indicator to show error
                    trailerLoading.innerHTML = `
            <div class="trailer-loading-text" style="color: #ff4444;">
                Failed to load trailer. Please try again later.
            </div>
        `;
                };

                // Add the new iframe
                trailerContainer.appendChild(iframe);

                // Set a timeout to hide the loading indicator even if onload doesn't trigger
                // This can happen with some embedded content
                setTimeout(() => {
                    trailerLoading.classList.add('hidden');
                    iframe.style.opacity = '1';
                }, 3000); // Reduced timeout to 3 seconds
            }

             * Close the trailer and stop it playing.
             *
             * Removing the iframe is the part that matters: hiding the overlay
             * alone leaves a YouTube embed playing, so the user dismisses the
             * trailer and the audio carries on from nowhere. It is removed after
             * the leave transition so the video does not vanish mid-fade.
             *
             * No scroll-lock bookkeeping here any more. This used to restore
             * body overflow only if the detail overlay was not also open —
             * a condition that had to be right in two places. The overlay system
             * counts open overlays itself, so the page stays locked while the
             * detail overlay remains up.
             */
            function closeTrailer() {
                setOverlay('trailerOpen', false);

                setTimeout(() => {
                    if (isOverlayOpen('trailerOpen')) return;

                    trailerLoading.classList.remove('hidden');
                    trailerLoading.innerHTML =
                        '<div class="trailer-spinner"></div>' +
                        '<div class="trailer-loading-text">Loading trailer...</div>';

                    const existingIframe = trailerContainer.querySelector('iframe');
                    if (existingIframe) existingIframe.remove();
                }, 300);
            }
            // Called from the markup's @click handlers.
            window.closeTrailer = closeTrailer;

            // Store reference to the original openModal function
            const originalOpenModal = window.openModal;

            // Override the openModal function to add trailer button functionality
            window.openModal = function (item, type) {
                // Call the original function first
                originalOpenModal(item, type);

                // Get the trailer button
                const trailerBtn = document.querySelector('.watch-trailer-btn');

                // Only show the trailer button for movies, not TV shows
                if (type === 'movies') {
                    trailerBtn.style.display = 'flex';

                    // Focus moves to this button BEFORE the trailer opens.
                    // The trailer is raised from inside the detail overlay, and
                    // the focus manager records where focus was when it opened;
                    // if that is the document body — which is what a touch tap
                    // leaves behind — it declines to restore, and dismissing the
                    // trailer drops the keyboard user at the top of the page
                    // instead of back here. Nothing errors.
                    trailerBtn.onclick = () => {
                        trailerBtn.focus();
                        openTrailer(item.title, item.year);
                    };
                } else {
                    trailerBtn.style.display = 'none';
                }
            };

            // Store reference to the original closeModal function
            const originalCloseModal = window.closeModal;

            // Override the closeModal function to also close trailer modal if open
            window.closeModal = function () {
                // Call the original function first
                originalCloseModal();

                // Dismissing the detail overlay takes the trailer with it —
                // otherwise the trailer is left floating over the library with
                // nothing behind it, still playing.
                if (isOverlayOpen('trailerOpen')) {
                    closeTrailer();
                }
            };
        });

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Glimpse Media Viewer</title>

    <!--
      Themed by the same tokens as the app, from a data-server attribute set
      below. This page used to be REGENERATED at container start by
      create_themed_offline() — a 230-line shell function that wrote three
      near-identical copies of this markup as heredocs. Now it is authored once
      and read-only at runtime.

      The attribute is read from the path rather than from config.json: this
      page is shown when the network is unavailable, which is exactly when
      config.json may not be reachable either. Falling back to the Plex palette
      is correct here — a themed page is better than an unstyled one, and being
      offline is not the moment to report a configuration error.

      WHEN THIS PAGE APPEARS, and why the copy says what it says. Since
      `serve-the-library-offline` the app caches the configuration and the
      library snapshots as it receives them, so a device that has loaded Glimpse
      successfully once opens offline and browses its saved library — it never
      gets here. What is left is the one case that has nothing to fall back to:
      a device opening Glimpse for the first time, with no network.

      So this page must not say "Glimpse needs a connection", which is what it
      used to say and is no longer true. It says the narrower thing: this device
      has nothing saved yet, and connecting once is what fixes that for good.

      This page is now hard to reach by accident, which is exactly how the copy
      inlined in sw.js went stale and started showing Plex orange to Jellyfin
      installs. Test it deliberately, from a fresh profile with the network off.
    -->
    <script>
        (function () {
            var segment = (window.location.pathname.split('/')[1] || '').toLowerCase();
            var server = ['plex', 'jellyfin', 'emby'].indexOf(segment) !== -1 ? segment : 'plex';
            document.documentElement.setAttribute('data-server', server);
        })();
    </script>

    <style>
        :root[data-server='plex'] {
            --primary-color: #e5a00d;
            --primary-hover: #f1b020;
        }

        :root[data-server='jellyfin'] {
            --primary-color: #00a4dc;
            --primary-hover: #0288c2;
        }

        :root[data-server='emby'] {
            --primary-color: #52c41a;
            --primary-hover: #389e0d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 500px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .hint {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 30px;
        }

        button {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">📶</div>
        <h1>You're Offline</h1>
        <p>This device hasn't loaded your library yet, so there's nothing saved to show.</p>
        <p class="hint">Connect to your Glimpse server once and it will keep working offline after that.</p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>

</html>

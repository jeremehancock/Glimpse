server {
    listen 80 default_server;
    server_name _;

    root /app/web;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # The snapshot: metadata and artwork written by the fetchers.
    #
    # `^~` is load-bearing. Without it, nginx checks the regex location below
    # BEFORE this prefix, so a request for /data/plex/posters/1.jpg matches on
    # its extension and is resolved against the document root instead of the
    # alias. `^~` tells nginx that once this prefix matches, regex locations are
    # not considered at all.
    location ^~ /data/ {
        alias /app/data/;
        autoindex off;

        # Artwork is content-addressed by item id and only rewritten when its
        # MD5 changes, so it caches well. The JSON must not: it is how the app
        # learns the library changed.
        location ~* \.(jpg|jpeg|png|gif)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
        location ~* \.json$ {
            expires -1;
            add_header Cache-Control "no-cache";
        }
    }

    # Generated at boot by the entrypoint, and the one file that must never be
    # cached: a restart with new settings has to take effect on the next load,
    # not whenever a cached copy happens to expire.
    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # The per-server routes. These are documented and bookmarkable, so they keep
    # working — but they are now the SAME page, not four copies of it. The app
    # reads the active server from the path.
    #
    # The previous implementation wrote a physically separate index.html into
    # /app/web/<server>/ with every relative path rewritten to `../`. That is
    # what create_server_index() existed to do, and why the entrypoint needed a
    # corruption-repair pass.
    location ~ ^/(plex|jellyfin|emby)(/.*)?$ {
        try_files /index.html =404;
    }

    # The service worker itself. Always revalidated, never held.
    #
    # `= /sw.js` is an exact match, which outranks the regex location below —
    # that one matched `.js` and handed the worker a 7-day cache. A stale
    # service worker is the worst thing in this file to cache: it is the code
    # that decides what everything ELSE is allowed to serve, so holding an old
    # copy freezes the caching policy of the whole app at whatever it was, and
    # the upgrade that would fix it is the thing being withheld.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # The app's own stylesheets and scripts. Revalidated, not held.
    #
    # `^~` so this beats the extension regex below. These filenames carry no
    # content hash and never will — nothing under web/ is built or bundled, so
    # the URL is identical from one release to the next while the bytes behind
    # it change. A 7-day cache is only safe when a changed file means a changed
    # URL, and here it does not: it pinned upgraded clients to the CSS and JS of
    # whichever build they first loaded.
    #
    # `no-cache` means revalidate, not "do not store". The browser still keeps
    # the file and still asks; nginx answers 304 from the ETag when it has not
    # changed, so the cost of correctness here is a conditional request.
    #
    # This is the other half of the service worker's network-first strategy —
    # sw.js calls plain fetch(), which consults the HTTP cache, so a long
    # max-age here would defeat it without either layer looking wrong alone.
    location ^~ /assets/ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Static assets baked into the image.
    location ~* \.(css|js|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* ^/images/.*\.(jpg|jpeg|png|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # The app shell. Not cached by nginx — the service worker owns offline
    # behavior, and a cached shell here would defeat its versioning.
    location / {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    # `root /app/web`, not `/usr/share/nginx/html`. This directive pointed at
    # the distro's default web root, which ships only its own `index.html` — so
    # `/50x.html` did not exist, the 5xx fell through to `error_page 404
    # /index.html`, and nginx served the whole application shell with status
    # 404. Measured: 186,727 bytes. The user got a working-looking app that
    # then could not load its data, which is indistinguishable from an empty
    # library. The status a user sees has to be the status that occurred.
    #
    # `internal` so the page is only ever reached by that redirect. Without it
    # `/50x.html` is a URL anyone can request and get a 200 error page, which is
    # its own small lie.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /app/web;
        internal;
    }
}

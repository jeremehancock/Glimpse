server {
    listen 80 default_server;
    server_name _;

    root /app/web;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # The snapshot: metadata and artwork written by the fetchers.
    #
    # `^~` is load-bearing. Without it, nginx checks the regex location below
    # BEFORE this prefix, so a request for /data/plex/posters/1.jpg matches on
    # its extension and is resolved against the document root instead of the
    # alias. `^~` tells nginx that once this prefix matches, regex locations are
    # not considered at all.
    location ^~ /data/ {
        alias /app/data/;
        autoindex off;

        # Artwork is content-addressed by item id and only rewritten when its
        # MD5 changes, so it caches well. The JSON must not: it is how the app
        # learns the library changed.
        location ~* \.(jpg|jpeg|png|gif)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
        location ~* \.json$ {
            expires -1;
            add_header Cache-Control "no-cache";
        }
    }

    # Generated at boot by the entrypoint, and the one file that must never be
    # cached: a restart with new settings has to take effect on the next load,
    # not whenever a cached copy happens to expire.
    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # The per-server routes. These are documented and bookmarkable, so they keep
    # working — but they are now the SAME page, not four copies of it. The app
    # reads the active server from the path.
    #
    # The previous implementation wrote a physically separate index.html into
    # /app/web/<server>/ with every relative path rewritten to `../`. That is
    # what create_server_index() existed to do, and why the entrypoint needed a
    # corruption-repair pass.
    location ~ ^/(plex|jellyfin|emby)(/.*)?$ {
        try_files /index.html =404;
    }

    # Static assets baked into the image.
    location ~* \.(css|js|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* ^/images/.*\.(jpg|jpeg|png|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # The app shell. Not cached by nginx — the service worker owns offline
    # behavior, and a cached shell here would defeat its versioning.
    location / {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
